<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>译宝</title>
    <style>
      /* 设计令牌在 src/assets/tokens.css（home.ts 引入）；这里只留窗口级 reset。

      body,
      #app {
        margin: 0;
        height: 100%;
        overflow: hidden;

      }

    <div id="app"></div>
    <script type="module" src="/src/home.ts"></script>
