name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sidecar:
    name: sidecar pytest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
        working-directory: sidecar
      - run: uv run pytest -q
        working-directory: sidecar

  frontend:
    name: vue-tsc + vitest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npx vue-tsc --noEmit
        working-directory: desktop
      - run: npx vite build
        working-directory: desktop
      - run: npm test
        working-directory: desktop

  panel:
    name: panel vitest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            scripts/panel-build/pnpm-lock.yaml
            plugins/coding/panel/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: scripts/panel-build
      - run: pnpm install --frozen-lockfile
        working-directory: plugins/coding/panel
      - run: pnpm test
        working-directory: plugins/coding/panel

  rust:
    name: cargo check + test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # tauri.conf.json 的 bundle.resources 引用 resources/bin/uv，缺失会让配置校验失败
      - run: ./scripts/prepare-dist.sh
        working-directory: desktop
      - run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
