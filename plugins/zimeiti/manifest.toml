# 自媒体（阶段 2 第二垂直：选题+写作尖刀）
# 对话式工作流：录选题 → 看板管理 →（对话）写初稿/改稿 → 版本落盘 → 待发布/已发布。
# 声明式 tool 管 topics CRUD/流转；方法论加载/文章版本落盘走 tools/ 代码 tool。
id = "zimeiti"
name = "内容创作"
description = "内容创作选题与写作：选题推荐（「今天写什么」→ skills/topics 技能）、选题看板、写稿改稿、版本管理、素材库（收藏链接/资料，写作时当论据召回）、热点雷达"
capabilities = ["db", "blobs", "llm", "process", "durable"]   # blobs：大内容走宿主 content-addressed store；durable：render 长任务走 DurableExecution（断点续跑/可取消）

[code]
entry = "tools"

# Workflow Pack 由插件声明；Work Graph 只认识通用 DAG/acceptance。
# 同 id 的更高版本会用于新 Workspace，已有 WorkflowRun 继续锁定原版本。
[[workflow]]
id = "video.explainer"
version = "1.1.0"
domain = "video"
label = "视频创作"
matches = ["视频", "video", "zimeiti", "storyboard", "timeline"]
stages = [
  {id = "topic", label = "选题", depends_on = [], acceptance = [{artifact_patterns = ["topic", "brief"]}]},
  {id = "evidence", label = "证据", depends_on = ["topic"], acceptance = [{artifact_patterns = ["material", "evidence", "claim", "research"]}]},
  {id = "script", label = "脚本", depends_on = ["evidence"], acceptance = [{artifact_patterns = ["script", "article", "doc"]}]},
  {id = "storyboard", label = "分镜", depends_on = ["script"], acceptance = [{artifact_patterns = ["storyboard", "shot"]}]},
  {id = "assets", label = "素材", depends_on = ["storyboard"], acceptance = [{artifact_patterns = ["asset", "image", "visual"]}]},
  {id = "voice", label = "配音", depends_on = ["storyboard"], acceptance = [{artifact_patterns = ["voice", "audio", "narration"]}]},
  {id = "compose", label = "合成", depends_on = ["assets", "voice"], acceptance = [{artifact_patterns = ["timeline", "composition"]}]},
  {id = "deliver", label = "交付", depends_on = ["compose"], acceptance = [{artifact_patterns = ["render", "export", "published"]}]},
]

[[table]]
name = "topics"
columns = [
  {name = "id", type = "text", pk = true},
  {name = "title", type = "text"},
  {name = "angle", type = "text", default = ""},
  {name = "platform", type = "text", default = ""},
  {name = "source", type = "text", default = ""},
  {name = "url", type = "text", default = ""},   # 来源链接（热点转选题带上原文地址，复盘可回溯）
  {name = "status", type = "text", default = "候选"},
  {name = "published_at", type = "integer", default = 0},
  {name = "published_version", type = "integer", default = 0},   # 发布时的稿版本（复盘对齐数据与稿）
  # 视频 workflow S0 选题卡字段（2026-08-31）：均为 JSON/文本，缺省空串（老选题天然空）
  {name = "hkrr", type = "text", default = ""},            # HKRR 标注 JSON：{"happy": 快乐, "knowledge": 知识, "resonance": 共鸣, "rhythm": 节奏}（快乐/知识/共鸣 ≥1 + 节奏可行）
  {name = "hook_type", type = "text", default = ""},       # 钩型（如 悬念/反常识/利益承诺）
  {name = "target_platform", type = "text", default = ""}, # 目标视频平台（抖音/B站/YouTube；platform 列仍是图文平台）
  {name = "cover_concepts", type = "text", default = ""},  # 封面概念 JSON 数组，恰好 3 条文案级方案（只出文字，图像生成是 V2）
  {name = "project_id", type = "text", default = ""},      # 立项回写：所属项目 id（空 = 未立项）
  {name = "created_at", type = "integer"},
  {name = "updated_at", type = "integer"},
]
indexes = ["status", "updated_at"]

[[table]]
name = "articles"
columns = [
  {name = "id", type = "text", pk = true},
  {name = "topic_id", type = "text"},
  {name = "version", type = "integer"},
  {name = "content_path", type = "text"},
  {name = "note", type = "text", default = ""},
  {name = "word_count", type = "integer", default = 0},       # 文档总字数（_wordcount 权威口径，保存时落；0=存量未算，读时懒补）
  {name = "narration_count", type = "integer", default = 0},  # 口播字数（现稿无口播段标记 = 总字数）
  {name = "created_at", type = "integer"},
]
indexes = ["topic_id"]

# storyboard_save / storyboard_get 由 tools/storyboard_save.py / storyboard_get.py 代码承接
# （2026-09-02 视频 workflow S2 分镜：shot 成一等对象——video.storyboard/video.shot artifact
# + contains/derived_from 边；动态 N 个 shot artifact 走 work_output foreach_from 扇出）
[[table]]
name = "storyboards"
columns = [
  {name = "id", type = "text", pk = true},
  {name = "topic_id", type = "text"},
  {name = "version", type = "integer"},
  {name = "shot_count", type = "integer", default = 0},
  {name = "content_path", type = "text"},
  {name = "note", type = "text", default = ""},
  {name = "created_at", type = "integer"},
]
indexes = ["topic_id"]

# voice_save 由 tools/voice_save.py 代码承接（2026-09-02 视频 workflow voice 段：
# 逐镜 say→afconvert→ffprobe 合成 m4a，voice.track artifact + derived_from video.shot 边）
[[table]]
name = "voice_tracks"
columns = [
  {name = "id", type = "text", pk = true},
  {name = "topic_id", type = "text"},
  {name = "storyboard_version", type = "integer"},
  {name = "shot_idx", type = "integer"},
  {name = "path", type = "text"},
  {name = "duration_sec", type = "real", default = 0},   # ffprobe 实测时长（timeline 用真实时长）
  {name = "voice", type = "text", default = ""},
  {name = "created_at", type = "integer"},
]
indexes = ["topic_id"]

# visual_card_save 由 tools/visual_card_save.py 代码承接（2026-09-02 视频 workflow assets 段：
# 降级占位视觉卡，asset.visual artifact + derived_from video.shot 边；degraded=1 诚实标注）
[[table]]
name = "visual_cards"
columns = [
  {name = "id", type = "text", pk = true},
  {name = "topic_id", type = "text"},
  {name = "storyboard_version", type = "integer"},
  {name = "shot_idx", type = "integer"},
  {name = "path", type = "text"},
  {name = "style", type = "text", default = "dark"},
  {name = "degraded", type = "integer", default = 1},
  {name = "created_at", type = "integer"},
]
indexes = ["topic_id"]

# timeline_save 由 tools/timeline_save.py 代码承接（2026-09-02 视频 workflow compose 段：
# 分镜+音轨+视觉卡组装 timeline JSON；timeline.composition artifact + derived_from/uses 边）
[[table]]
name = "timelines"
columns = [
  {name = "id", type = "text", pk = true},
  {name = "topic_id", type = "text"},
  {name = "version", type = "integer"},
  {name = "storyboard_version", type = "integer"},   # 溯源：组自哪版分镜
  {name = "clip_count", type = "integer", default = 0},
  {name = "duration_sec", type = "real", default = 0},   # 各 clip 真实时长求和
  {name = "content_path", type = "text"},
  {name = "created_at", type = "integer"},
]
indexes = ["topic_id"]

# render_save 由 tools/render_save.py 代码承接（2026-09-02 视频 workflow deliver 段：
# ffmpeg 渲真 MP4；video.render artifact + rendered_from timeline.composition 边；
# 长任务走 DurableExecution（durable capability），execution_id 溯源）
[[table]]
name = "renders"
columns = [
  {name = "id", type = "text", pk = true},
  {name = "topic_id", type = "text"},
  {name = "version", type = "integer"},
  {name = "timeline_version", type = "integer"},
  {name = "storyboard_version", type = "integer"},
  {name = "path", type = "text"},
  {name = "duration_sec", type = "real", default = 0},   # ffprobe 实测成片时长
  {name = "resolution", type = "text", default = ""},    # ffprobe 实测，如 1080x1920
  {name = "execution_id", type = "text", default = ""},  # durable execution 溯源（同步退路为空）
  {name = "created_at", type = "integer"},
]
indexes = ["topic_id"]

[[table]]
name = "materials"
columns = [
  {name = "id", type = "text", pk = true},
  {name = "title", type = "text"},
  {name = "url", type = "text", default = ""},
  {name = "kind", type = "text", default = "note"},
  {name = "summary", type = "text", default = ""},
  {name = "tags", type = "text", default = ""},
  {name = "content", type = "text", default = ""},
  {name = "topic_id", type = "text", default = ""},
  {name = "created_at", type = "integer"},
  {name = "updated_at", type = "integer"},
]
indexes = ["updated_at", "topic_id"]

[[table]]
name = "post_stats"
columns = [
  {name = "id", type = "text", pk = true},
  {name = "topic_id", type = "text"},
  {name = "platform", type = "text", default = ""},
  {name = "views", type = "integer", default = 0},
  {name = "likes", type = "integer", default = 0},
  {name = "comments", type = "integer", default = 0},
  {name = "favorites", type = "integer", default = 0},
  {name = "shares", type = "integer", default = 0},
  {name = "recorded_at", type = "integer"},
]
indexes = ["topic_id"]

# add 已由 tools/add_topic.py 代码承接（2026-09-02 P1-02 后续：会话绑定项目时自动回写
# project_id，免模型手工 zimeiti.update 双写漂移；required/params/risk/panel/refresh/
# work_output 与原声明式等价，quiet 保留参数在代码 openai_schema 里声明）

# list 已由 tools/list_topics.py 代码承接（2026-09-02 项目作用域：会话绑定项目时默认
# 只列本项目选题，scope="global"/project_id 显式放宽；scope/project_id 参数在代码
# openai_schema 里声明）

[[tool]]
id = "open_editor"
label = "打开编辑器"
type = "db"
description = "打开选题的写作编辑器（用户点名「打开编辑器」「进编辑器写稿」「打开选题X的编辑器」时用；面板自动加载该选题最新稿）。只是查看详情用 get。"
risk = "L0"
panel = "zimeiti:editor"
explicit = true   # 用户点名要编辑器 → 宿主可弹 stage（写稿工作面）
required = ["id"]
[tool.params]
id = {type = "string", description = "选题 id（zimeiti.list 返回的 id）"}
[tool.db]
op = "query"
table = "topics"
limit = 1

[[tool]]
id = "update"
label = "改选题"
type = "db"
description = "改选题字段（只更新传入的字段；改状态用 move）。project_id 是立项流程回写用，平时不要动"
risk = "L1"
panel = "zimeiti:detail"
refresh = "get"
required = ["id"]
[tool.params]
id = {type = "string", description = "选题 id"}
title = {type = "string", description = "新标题（可选）"}
angle = {type = "string", description = "新角度（可选）"}
platform = {type = "string", description = "新目标平台（可选）"}
hkrr = {type = "string", description = "新 HKRR 标注 JSON 字符串（可选，同 add）"}
hook_type = {type = "string", description = "新钩型（可选）"}
target_platform = {type = "string", description = "新目标视频平台（可选）"}
cover_concepts = {type = "string", description = "新封面概念 JSON 数组字符串，恰好 3 条（可选）"}
project_id = {type = "string", description = "立项回写的项目 id（仅立项流程用）"}
[tool.db]
op = "update"
table = "topics"
auto = {updated_at = "unixts"}

# get 已由 tools/get_topic.py 代码承接（按 id 查时拼稿件版本/字数/素材数聚合字段，v2 #14）

# delete 已由 tools/delete_topic.py 代码承接（级联清理稿件文件/素材关联/发布数据）

# mat_list 已由 tools/mat_list.py 代码承接（2026-09-02 项目作用域：materials 无
# project_id 列，经 topic_id 反解选题归属；绑定项目的会话默认只列本项目素材，
# 孤儿素材只在 scope="global" 可见；scope/project_id 参数在代码 openai_schema 里声明）

[[tool]]
id = "mat_get"
label = "素材正文"
type = "db"
description = "取一条素材的全文（写作引用论据时用；mat_list 里挑中后调它）"
risk = "L0"
required = ["id"]
[tool.params]
id = {type = "string", description = "素材 id"}
[tool.db]
op = "query"
table = "materials"

[[tool]]
id = "mat_delete"
label = "删素材"
type = "db"
description = "删除一条素材"
risk = "L2"
panel = "zimeiti:materials"
refresh = "mat_list"
required = ["id"]
[tool.params]
id = {type = "string", description = "素材 id"}
[tool.db]
op = "delete"
table = "materials"

[[tool]]
id = "mat_link"
label = "关联素材"
type = "db"
description = "把一条已有素材关联到某个选题"
risk = "L1"
required = ["id", "topic_id"]
[tool.params]
id = {type = "string", description = "素材 id"}
topic_id = {type = "string", description = "选题 id"}
[tool.db]
op = "update"
table = "materials"
auto = {updated_at = "unixts"}

# stat_add 已由 tools/stat_add.py 代码承接（同选题同平台同日去重 + 收藏/转发指标）

[[tool]]
id = "stat_list"
label = "发布数据"
type = "db"
description = "列出发布数据（按记录时间倒序，最多 50 条）。运行时 where 由调用方传，如 {where: {topic_id: …}} 按选题过滤；不传则列全部"
risk = "L0"
[tool.db]
op = "query"
table = "post_stats"
order = "recorded_at DESC"
limit = 50

[[panel]]
type = "schema"
name = "board"
label = "选题看板"
src = "panel/board.schema.json"
open = "list"   # 面板级入口；也是摊开/开窗「打开即重拉」的数据源（走查 B2/M3 快照陈旧修复）

[[panel]]
type = "schema"
name = "detail"
label = "选题详情"
src = "panel/detail.schema.json"

[[panel]]
type = "webview"
name = "editor"
label = "写作编辑器"
src = "panel/editor.html"

[[panel]]
type = "schema"
name = "materials"
label = "素材库"
src = "panel/materials.schema.json"
open = "mat_list"   # 面板级入口：插件页子入口直调此 api 方法打开

[[panel]]
type = "schema"
name = "record"
label = "录数据"
src = "panel/record.schema.json"

[[panel]]
type = "schema"
name = "matdoc"
label = "素材正文"
src = "panel/matdoc.schema.json"

[[panel]]
type = "schema"
name = "hot"
label = "热点雷达"
src = "panel/hot.schema.json"
open = "hot_topics"   # 面板级入口：插件页子入口直调此 api 方法打开
