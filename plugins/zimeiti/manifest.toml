# 自媒体（阶段 2 第二垂直：选题+写作尖刀）
# 对话式工作流：录选题 → 看板管理 →（对话）写初稿/改稿 → 版本落盘 → 待发布/已发布。
# 声明式 tool 管 topics CRUD/流转；方法论加载/文章版本落盘走 tools/ 代码 tool。
id = "zimeiti"
name = "自媒体"
description = "自媒体选题与写作：选题看板、写稿改稿、版本管理、素材库（收藏链接/资料，写作时当论据召回）"
capabilities = ["db", "llm"]

[code]
entry = "tools"

[[table]]
name = "topics"
columns = [
  {name = "id", type = "text", pk = true},
  {name = "title", type = "text"},
  {name = "angle", type = "text", default = ""},
  {name = "platform", type = "text", default = ""},
  {name = "source", type = "text", default = ""},
  {name = "status", type = "text", default = "候选"},
  {name = "published_at", type = "integer", default = 0},
  {name = "created_at", type = "integer"},
  {name = "updated_at", type = "integer"},
]
indexes = ["status", "updated_at"]

[[table]]
name = "articles"
columns = [
  {name = "id", type = "text", pk = true},
  {name = "topic_id", type = "text"},
  {name = "version", type = "integer"},
  {name = "content_path", type = "text"},
  {name = "note", type = "text", default = ""},
  {name = "created_at", type = "integer"},
]
indexes = ["topic_id"]

[[table]]
name = "materials"
columns = [
  {name = "id", type = "text", pk = true},
  {name = "title", type = "text"},
  {name = "url", type = "text", default = ""},
  {name = "kind", type = "text", default = "note"},
  {name = "summary", type = "text", default = ""},
  {name = "tags", type = "text", default = ""},
  {name = "content", type = "text", default = ""},
  {name = "topic_id", type = "text", default = ""},
  {name = "created_at", type = "integer"},
  {name = "updated_at", type = "integer"},
]
indexes = ["updated_at", "topic_id"]

[[table]]
name = "post_stats"
columns = [
  {name = "id", type = "text", pk = true},
  {name = "topic_id", type = "text"},
  {name = "platform", type = "text", default = ""},
  {name = "views", type = "integer", default = 0},
  {name = "likes", type = "integer", default = 0},
  {name = "comments", type = "integer", default = 0},
  {name = "recorded_at", type = "integer"},
]
indexes = ["topic_id"]

[[tool]]
id = "add"
type = "db"
description = "记录一条新选题（标题必填），初始状态为「候选」进看板"
risk = "L1"
panel = "zimeiti:board"
refresh = "list"   # 写入后面板拿刷新后的看板，而非回执 {"id":…}
required = ["title"]
[tool.params]
title = {type = "string", description = "选题标题（一句话说清要写什么）"}
angle = {type = "string", description = "切入角度：从哪个点写、给谁看"}
platform = {type = "string", description = "目标平台（如公众号/小红书/播客）"}
source = {type = "string", description = "选题来源（如灵感/读者反馈/热点）"}
[tool.db]
op = "insert"
table = "topics"
auto = {created_at = "unixts", updated_at = "unixts"}   # 时间戳由系统生成（unix 秒）

[[tool]]
id = "list"
type = "db"
description = "列出选题看板（按更新时间倒序，最多 100 条）"
risk = "L0"
panel = "zimeiti:board"
explicit = true   # 对话点名「看看选题看板」→ 宿主可弹面板（写操作 refresh 跟单不抬档）
[tool.db]
op = "query"
table = "topics"
order = "updated_at DESC"
limit = 100

[[tool]]
id = "open_editor"
type = "db"
description = "打开选题的写作编辑器（用户点名「打开编辑器」「进编辑器写稿」「打开选题X的编辑器」时用；面板自动加载该选题最新稿）。只是查看详情用 get。"
risk = "L0"
panel = "zimeiti:editor"
explicit = true   # 用户点名要编辑器 → 宿主可弹 stage（写稿工作面）
required = ["id"]
[tool.params]
id = {type = "string", description = "选题 id（zimeiti.list 返回的 id）"}
[tool.db]
op = "query"
table = "topics"
limit = 1

[[tool]]
id = "get"
type = "db"
description = "查看一条选题的详情（运行时 where 由调用方传，如 {where: {id: …}}）"
risk = "L0"
panel = "zimeiti:detail"
[tool.params]
id = {type = "string", description = "选题 id（传了就按 id 查；同时是 refresh 传参交集的依据）"}
[tool.db]
op = "query"
table = "topics"

[[tool]]
id = "move"
type = "db"
description = "选题状态流转：候选/写作中/待发布/已发布"
risk = "L1"
panel = "zimeiti:detail"
refresh = "get"
required = ["id", "status"]
[tool.params]
id = {type = "string", description = "选题 id"}
status = {type = "string", description = "目标状态：候选 / 写作中 / 待发布 / 已发布"}
[tool.db]
op = "update"
table = "topics"
auto = {updated_at = "unixts"}

[[tool]]
id = "delete"
type = "db"
description = "删除一条选题"
risk = "L2"
panel = "zimeiti:board"
refresh = "list"
required = ["id"]
[tool.params]
id = {type = "string", description = "选题 id"}
[tool.db]
op = "delete"
table = "topics"

[[tool]]
id = "mat_list"
type = "db"
description = "列出素材库（标题/摘要/标签，按更新时间倒序，最多 100 条）。写稿前先看有没有可当论据的素材，有就 mat_get 取正文"
risk = "L0"
panel = "zimeiti:materials"
[tool.db]
op = "query"
table = "materials"
order = "updated_at DESC"
limit = 100

[[tool]]
id = "mat_get"
type = "db"
description = "取一条素材的全文（写作引用论据时用；mat_list 里挑中后调它）"
risk = "L0"
required = ["id"]
[tool.params]
id = {type = "string", description = "素材 id"}
[tool.db]
op = "query"
table = "materials"

[[tool]]
id = "mat_delete"
type = "db"
description = "删除一条素材"
risk = "L2"
panel = "zimeiti:materials"
refresh = "mat_list"
required = ["id"]
[tool.params]
id = {type = "string", description = "素材 id"}
[tool.db]
op = "delete"
table = "materials"

[[tool]]
id = "mat_link"
type = "db"
description = "把一条已有素材关联到某个选题"
risk = "L1"
required = ["id", "topic_id"]
[tool.params]
id = {type = "string", description = "素材 id"}
topic_id = {type = "string", description = "选题 id"}
[tool.db]
op = "update"
table = "materials"
auto = {updated_at = "unixts"}

[[tool]]
id = "stat_add"
type = "db"
description = "记录某选题在某平台的发布数据（阅读/赞/评论），用于复盘"
risk = "L1"
required = ["topic_id", "platform"]
[tool.params]
topic_id = {type = "string", description = "选题 id"}
platform = {type = "string", description = "发布平台（如 公众号/小红书/知乎）"}
views = {type = "integer", description = "阅读数，没有就 0"}
likes = {type = "integer", description = "点赞数，没有就 0"}
comments = {type = "integer", description = "评论数，没有就 0"}
[tool.db]
op = "insert"
table = "post_stats"
auto = {recorded_at = "unixts"}

[[tool]]
id = "stat_list"
type = "db"
description = "列出发布数据（按记录时间倒序，最多 50 条）。运行时 where 由调用方传，如 {where: {topic_id: …}} 按选题过滤；不传则列全部"
risk = "L0"
[tool.db]
op = "query"
table = "post_stats"
order = "recorded_at DESC"
limit = 50

[[panel]]
type = "schema"
name = "board"
label = "选题看板"
src = "panel/board.schema.json"

[[panel]]
type = "schema"
name = "detail"
label = "选题详情"
src = "panel/detail.schema.json"

[[panel]]
type = "webview"
name = "editor"
label = "写作编辑器"
src = "panel/editor.html"

[[panel]]
type = "schema"
name = "materials"
label = "素材库"
src = "panel/materials.schema.json"
open = "mat_list"   # 面板级入口：插件页子入口直调此 api 方法打开

[[panel]]
type = "schema"
name = "hot"
label = "热点雷达"
src = "panel/hot.schema.json"
open = "hot_topics"   # 面板级入口：插件页子入口直调此 api 方法打开
