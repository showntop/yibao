# 面板可调方法白名单（v2 §7）：direct 直调过闸门不过 LLM；intent 渲染后走 agent 流程
[[method]]
name = "list"
handler = "zimeiti.list"
direct = true
panel = "zimeiti:board"   # 看板数据自带看板引用：素材统计卡「去看看」直达（refresh 链路同享）

[[method]]
name = "add"
handler = "zimeiti.add"
direct = true
refresh = "zimeiti.list"   # 快捷新增后跟一次看板查询

[[method]]
name = "get"
handler = "zimeiti.get"
direct = true

[[method]]
name = "move"
handler = "zimeiti.move"
direct = true
refresh = "zimeiti.list"   # 流转后跟一次看板查询，卡片落到新状态列

[[method]]
name = "delete"
handler = "zimeiti.delete"
direct = true
refresh = "zimeiti.list"

# 素材库面板：列表与删除（存素材走对话 zimeiti.mat_save，LLM 摘要打标）
[[method]]
name = "mat_list"
handler = "zimeiti.mat_list"
direct = true

# 详情页「录数据」：get 拿选题上下文，panel 覆盖到录数据表单（同 open_editor 的 panel 覆盖姿势）
[[method]]
name = "record"
handler = "zimeiti.get"
direct = true
panel = "zimeiti:record"

# 录数据表单提交：直调落库（无 panel 引用 → 不回弹面板，表单停留可连续录；回执走 action_result）
[[method]]
name = "stat_add"
handler = "zimeiti.stat_add"
direct = true

# 素材库条目「查看」：取正文进阅读面板（doc 渲染）
[[method]]
name = "mat_get"
handler = "zimeiti.mat_get"
direct = true
panel = "zimeiti:matdoc"

# 编辑器素材抽屉取数：只回数据、不发 panel 事件（quiet）——
# 抽屉并发查全量+关联两条，非 quiet 时 0 行的关联查询会发空面板事件把 12 行的全量面板冲掉（last-write-wins）
[[method]]
name = "mat_peek"
handler = "zimeiti.mat_list"
direct = true
quiet = true

# 器物架统计卡的素材计数（挂载 + 每分钟轮询）：只取行数、不发 panel 事件（quiet）——
# 非 quiet 时每次轮询都发素材库面板事件，会把恢复出来/正在看的面板冲成素材库（走查 W1；
# 照 coding.sessions / 上方 mat_peek 的 quiet 别名先例）
[[method]]
name = "mat_count"
handler = "zimeiti.mat_list"
direct = true
quiet = true

[[method]]
name = "mat_delete"
handler = "zimeiti.mat_delete"
direct = true
refresh = "zimeiti.mat_list"

# webview 写作编辑器：打开（panel 字段把直调结果引到编辑器面板，覆盖 zimeiti.get 自带的 detail 引用）
# 与编辑器内的读稿/保存；保存成功仍停在编辑器（回执 data 由桥回包带给 iframe，panel 重发不改变编辑器状态）
[[method]]
name = "open_editor"
handler = "zimeiti.get"
direct = true
panel = "zimeiti:editor"

[[method]]
name = "read_article"
handler = "zimeiti.article_read"
direct = true

[[method]]
name = "save_article"
handler = "zimeiti.article_save"
direct = true
panel = "zimeiti:editor"

# 编辑器选段 AI 协作：直调返回 {replacement} 给 iframe 做 diff 预览，不落盘、不发 panel 事件
[[method]]
name = "ai_edit"
handler = "zimeiti.ai_edit"
direct = true

# 编辑器内「标为已发布」：静默流转（无 panel/refresh，编辑器不跳转看板/详情）
[[method]]
name = "set_status"
handler = "zimeiti.set_status"
direct = true

# 详情页「复制成稿」：标题+正文进剪贴板 + 标已发布记时间；refresh 回详情看状态变化
[[method]]
name = "publish"
handler = "zimeiti.publish"
direct = true
refresh = "zimeiti.get"

# 编辑器版本历史：直调返回 {rows} 给 iframe；具体某版正文走 read_article?version=N
[[method]]
name = "versions"
handler = "zimeiti.versions"
direct = true

# 热点雷达：拉多平台热榜（L1 直调不弹确认）；「转选题」映射 zimeiti.add，
# panel 钉在热点雷达（不跳看板），refresh 回刷热榜拿最新数据
[[method]]
name = "hot_topics"
handler = "zimeiti.hot_topics"
direct = true

[[method]]
name = "hot_add"
handler = "zimeiti.add"
direct = true
panel = "zimeiti:hot"
refresh = "zimeiti.hot_topics"

# 热点「存素材」：链接交给 mat_save 抓正文归档，面板钉在热点雷达（不跳素材库），refresh 回刷热榜
[[method]]
name = "hot_mat_save"
handler = "zimeiti.mat_save"
direct = true
panel = "zimeiti:hot"
refresh = "zimeiti.hot_topics"

# 唤起条「存素材」：划词文本直存（LLM 摘要打标）；quiet 不弹素材库面板，回执由壳侧气泡给
[[method]]
name = "invoke_mat_save"
handler = "zimeiti.mat_save"
direct = true
quiet = true

# 浏览器扩展「存为选题」：标题上看板；quiet 不弹看板面板，回执由壳侧气泡给
[[method]]
name = "invoke_add_topic"
handler = "zimeiti.add"
direct = true
quiet = true

# 以下为 intent 方法（direct=false）：{title}/{id} 占位由面板 action 参数渲染，
# 交给 agent 多步完成（加载方法论 → 生成/改写 → 落盘存版本），handler 仅作注册校验锚点
[[method]]
name = "draft"
handler = "zimeiti.article_save"
intent = "为选题「{title}」写初稿：先用 zimeiti.get 取选题详情（id={id}，拿 angle/platform/source 对齐写作方向），再用 use_skill 展开 zimeiti:write 技能（成文框架+平台规格+发布前自检），成稿后用 zimeiti.article_save 落盘存版本（id={id}）"

[[method]]
name = "revise"
handler = "zimeiti.article_read"
intent = "修改选题「{title}」的稿件：先用 zimeiti.article_read 读最新稿（id={id}），问我修改意见或直接按对话里的意见改写，用 zimeiti.article_save 存新版本"

[[method]]
name = "read"
handler = "zimeiti.article_read"
intent = "读选题「{title}」的最新稿（id={id}）：用 zimeiti.article_read 读出来，给我展示全文或要点"

[[method]]
name = "review"
handler = "zimeiti.stat_list"
intent = "复盘选题「{title}」（id={id}）：先用 zimeiti.stat_list 查它的发布数据（where 按 topic_id 过滤；没有数据就先问我数据或跳过），再用 zimeiti.article_read 读最新稿（id={id}），然后给我一份复盘：这篇内容好在哪、差在哪、数据反映了什么、下次同方向选题怎么改进。复盘要点存进长期记忆。"

# 详情页「立项」（视频 workflow S0 相变）：走 agent 流程——project.create 是 L3 阶段门，
# 闸门卡由系统弹出请用户按印，面板不直调绕过；确认后选题挂进新项目并回写 project_id
[[method]]
name = "promote"
handler = "zimeiti.get"
intent = "为选题「{title}」（id={id}）立项成项目：第一步调用 project.create，name 用「{title}」，objects 传一个数组、唯一元素的 type 是 zimeiti.topic、ref 是 {id}（把这条选题挂进新项目）。project.create 是阶段门动作，系统会弹确认条等我按印——照常发起即可，不要试图绕过确认；我拒绝就停下。创建成功后第二步调用 zimeiti.update，参数 id={id}、project_id 为新项目的 id（回写立项状态，详情卡会显示「已立项」）。若创建失败（如项目名重复），告诉我原因，不要反复重试。完成后告诉我项目名和项目目录路径。"

# ---- 事件白名单（design §3 事件通道）：面板经 yibao.emitEvent 上报，未声明的拒收 ----
[[event]]
name = "zimeiti.selection_changed"   # 编辑器选区变化（对象模型锚点上行，节流）
[[event]]
name = "zimeiti.doc_snapshot"        # 文档快照（打开/保存时全量，surface.read 数据源）
[[event]]
name = "zimeiti.editor_applied"      # 人在 diff 卡点了接受/拒绝（surface 命令裁决结果）
