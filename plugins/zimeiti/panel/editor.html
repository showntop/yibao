<!DOCTYPE html>
<!-- zimeiti 写作编辑器（webview 面板）：跑在 iframe sandbox + srcdoc 里，无 Tauri IPC、无网络。
     能力调用全部经 window.yibao.invoke（postMessage 桥 → api.toml 白名单 + 风险闸门）。
     桥 JS 由父侧注入（提供 window.yibao.invoke/onInit），本文件不自带。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>写作编辑器</title>
<style>
  /* 设计 token 整段照抄 tools.html（iframe 沙箱内吃不到 tokens.css，内联写死） */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f6f1ea; --card: #ffffff; --border: #eee4d6; --border-soft: #f3ecdf;
    --text: #3f372e; --muted: #a89a86; --faint: #c9bcab;
    --accent: #ff8a5c; --accent-deep: #f2703f; --accent-soft: #fff0e8;
    --green-bg: #dcf0e2; --green: #3e8e5a; --green-bar: #8fd0a6;
    --red-bg: #fce7e3; --red: #c0574b; --red-bar: #f0aaa1;
    --mono: 12.5px/1.6 "SF Mono", ui-monospace, Menlo, monospace;
  }
  html, body { height: 100%; }
  body {
    font: 13px/1.6 -apple-system, "PingFang SC", sans-serif;
    background: var(--bg); color: var(--text); padding: 14px;
    display: flex; flex-direction: column;
  }

  /* ---- 头部工具条（按钮分 主/ghost 两级，同 tools.html）---- */
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex: none; }
  #title { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.act {
    border: none; border-radius: 10px; padding: 6px 16px; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 600;
    box-shadow: 0 2px 6px rgba(242, 112, 63, .3); transition: all .15s ease;
    flex: none;
  }
  button.act:hover { background: var(--accent-deep); }
  button.act:active { transform: scale(.97); }
  button.act:disabled { opacity: .5; cursor: default; }
  button.ghost {
    background: transparent; color: #8a7a66; border: 1px solid #e3d7c4;
    box-shadow: none; font-weight: 500;
  }
  button.ghost:hover { background: #faf3ea; color: var(--text); border-color: #d8c9b2; }
  #note {
    width: 160px; flex: none; border: 1px solid #e3d7c4; border-radius: 10px; padding: 5px 10px;
    font-size: 12.5px; background: #fff; color: var(--text); outline: none; font-family: inherit;
    transition: border-color .15s ease;
  }
  #note:focus { border-color: var(--accent); }
  #note::placeholder { color: var(--faint); }

  /* ---- 编辑区 / 预览区（一张卡片，中间细分隔线）---- */
  main {
    flex: 1; display: flex; min-height: 0;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 1px 2px rgba(90, 70, 50, .04), 0 6px 16px rgba(90, 70, 50, .05);
    overflow: hidden; margin-bottom: 10px;
  }
  #editor {
    flex: 1; min-width: 0; border: none; outline: none; resize: none; padding: 12px 14px;
    font: var(--mono); background: transparent; color: var(--text);
  }
  #editor::placeholder { color: var(--faint); }
  #preview-wrap {
    flex: 1; min-width: 0; position: relative; display: flex;
    border-left: 1px solid var(--border-soft);
  }
  #preview { flex: 1; overflow-y: auto; padding: 12px 14px; font-size: 13px; }
  #preview h1 { font-size: 18px; margin: 0.6em 0 0.4em; }
  #preview h2 { font-size: 16px; margin: 0.6em 0 0.4em; }
  #preview h3 { font-size: 14.5px; margin: 0.6em 0 0.4em; }
  #preview p { margin: 0.5em 0; }
  #preview ul { margin: 0.5em 0; padding-left: 1.4em; }
  #preview blockquote {
    margin: 0.5em 0; padding: 8px 12px; border-left: 3px solid var(--border);
    color: var(--muted); background: #faf7f2; border-radius: 0 8px 8px 0;
  }

  /* ---- 空态（纯 CSS：编辑区为空、placeholder 可见时盖住预览区；不挡点击）---- */
  #empty-state {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; text-align: center;
    padding: 18px; pointer-events: none; background: var(--card);
  }
  #empty-state .t { font-size: 14px; font-weight: 600; color: var(--muted); }
  #empty-state .s { font-size: 12px; color: var(--faint); line-height: 1.7; }
  #editor:not(:placeholder-shown) ~ #preview-wrap #empty-state { display: none; }

  /* ---- 状态栏 ---- */
  #status { padding: 0 4px; font-size: 11.5px; color: var(--muted); min-height: 22px; flex: none; }
  #status.err { color: var(--red); }

  /* ---- 选段浮动条（选中文字后浮出：AI 改写/扩写/缩写/自定义）---- */
  [hidden] { display: none !important; }
  #selbar {
    position: fixed; z-index: 30; display: flex; align-items: center; gap: 4px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 5px 6px; box-shadow: 0 4px 16px rgba(90, 70, 50, .16);
  }
  #selbar button {
    border: none; border-radius: 8px; padding: 4px 10px; cursor: pointer;
    background: transparent; color: var(--text); font-size: 12px; font-weight: 500;
    transition: background .12s ease;
  }
  #selbar button:hover { background: var(--accent-soft); color: var(--accent-deep); }
  #selbar button:disabled { opacity: .45; cursor: default; }
  #selbar .sep { width: 1px; height: 14px; background: var(--border); margin: 0 2px; }
  #custom-inst {
    width: 130px; border: 1px solid #e3d7c4; border-radius: 8px; padding: 3px 8px;
    font-size: 12px; background: #fff; color: var(--text); outline: none; font-family: inherit;
  }
  #custom-inst:focus { border-color: var(--accent); }

  /* ---- 弹层共用骨架（diff / 发布 / 历史 / 素材）：.ovl 遮罩 + .card 卡片 ---- */
  .ovl {
    position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
    background: rgba(63, 55, 46, .28); backdrop-filter: blur(2px);
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 12px 40px rgba(90, 70, 50, .25); overflow: hidden;
  }
  .card > header {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px; margin: 0;
    border-bottom: 1px solid var(--border-soft); flex: none; font-size: 12.5px; font-weight: 600;
  }
  .card > header .sp { flex: 1; }

  /* ---- AI 建议 diff 预览（确认才落稿）---- */
  #diff-card { width: min(680px, 92%); max-height: 82%; display: flex; flex-direction: column; }
  #diff-body {
    flex: 1; overflow-y: auto; padding: 10px 14px; font: var(--mono); white-space: pre-wrap;
    word-break: break-word;
  }
  #diff-body .d { background: var(--red-bg); color: var(--red); border-radius: 6px; padding: 1px 6px; margin: 1px 0; text-decoration: line-through; }
  #diff-body .a { background: var(--green-bg); color: var(--green); border-radius: 6px; padding: 1px 6px; margin: 1px 0; }
  #diff-body .s { color: var(--muted); padding: 1px 6px; margin: 1px 0; }

  /* ---- 发布弹层（格式化复制 + 标为已发布）/ 平台选择弹层（共用 opt 选项样式）---- */
  #pub-card, #pf-card { width: min(400px, 92%); }
  .opts { padding: 12px 14px 4px; }
  .opt {
    display: block; width: 100%; text-align: left; cursor: pointer; margin: 0 0 10px;
    background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px;
    font-family: inherit; transition: all .15s ease;
  }
  .opt:hover { border-color: var(--accent); background: var(--accent-soft); }
  .opt .t { font-size: 13px; font-weight: 600; color: var(--text); }
  .opt .s { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  #pub-card footer {
    padding: 10px 14px 12px; border-top: 1px solid var(--border-soft);
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  #pub-card footer .hint { font-size: 11px; color: var(--faint); }

  /* ---- 版本历史 / 素材 / 标题候选弹层 ---- */
  #hist-card, #mat-card, #tt-card { width: min(520px, 92%); max-height: 76%; display: flex; flex-direction: column; }
  #hist-body, #mat-body, #tt-body { flex: 1; overflow-y: auto; padding: 6px 14px 10px; }
  .hrow { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--border-soft); }
  .hrow:last-child { border-bottom: none; }
  .hrow .v { font: 600 12.5px "SF Mono", ui-monospace, Menlo, monospace; color: var(--accent-deep); flex: none; }
  .hrow .n { flex: 1; min-width: 0; font-size: 12.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hrow .t { font-size: 11px; color: var(--faint); flex: none; }
  .hrow .hcmp {
    flex: none; border: 1px solid #e3d7c4; border-radius: 8px; padding: 3px 10px; cursor: pointer;
    background: transparent; color: #8a7a66; font-size: 11.5px; font-family: inherit; transition: all .15s ease;
  }
  .hrow .hcmp:hover { background: var(--accent-soft); color: var(--accent-deep); border-color: var(--accent); }
  .hempty, .mempty { padding: 26px 0; text-align: center; font-size: 12px; color: var(--faint); }

  /* ---- 素材弹层（挑一条当论据插到光标处）---- */
  .mrow {
    display: block; width: 100%; text-align: left; cursor: pointer; background: transparent;
    border: none; border-bottom: 1px solid var(--border-soft); padding: 9px 4px;
    font-family: inherit; border-radius: 8px; transition: background .15s ease;
  }
  .mrow:hover { background: var(--accent-soft); }
  .mrow .mt { font-size: 12.5px; font-weight: 600; color: var(--text); }
  .mrow .ms {
    font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
</style>
</head>
<body>
<header>
  <button id="back" class="act ghost" title="返回选题详情">‹ 返回</button>
  <span id="title">写作编辑器</span>
  <input id="note" placeholder="版本备注（可选）">
  <button id="history" class="act ghost">历史</button>
  <button id="mats" class="act ghost" title="从素材库挑一条当论据插到光标处">素材</button>
  <button id="ai-polish" class="act ghost" title="全文润色：事实结构不变，表达更顺">润色</button>
  <button id="ai-title" class="act ghost" title="基于全文出 5 个候选标题">标题</button>
  <button id="ai-platform" class="act ghost" title="按目标平台风格改写全文">平台</button>
  <button id="publish" class="act ghost">发布…</button>
  <button id="save" class="act">保存为新版本</button>
</header>
<main>
  <textarea id="editor" placeholder="在这里写稿（markdown）；也可以对译宝说「写初稿 / 改稿 / 读稿」，它会直接改这里" spellcheck="false"></textarea>
  <div id="preview-wrap">
    <div id="preview"></div>
    <div id="empty-state">
      <div class="t">还没有稿件</div>
      <div class="s">对译宝说「写初稿」，或直接在左侧开写</div>
    </div>
  </div>
</main>
<div id="status">正在等译宝把选题送过来…</div>

<!-- 选段 AI 浮动条 -->
<div id="selbar" hidden>
  <button data-mode="rewrite">改写</button>
  <button data-mode="expand">扩写</button>
  <button data-mode="condense">缩写</button>
  <span class="sep"></span>
  <span id="selbar-custom" hidden>
    <input id="custom-inst" placeholder="想怎么处理？">
  </span>
  <button data-mode="custom">自定义…</button>
</div>

<!-- AI 建议 diff 预览 -->
<div id="diff-overlay" class="ovl" hidden>
  <div id="diff-card" class="card">
    <header>
      AI 建议 · <span id="diff-mode"></span>
      <span class="sp"></span>
      <button id="diff-cancel" class="act ghost">取消</button>
      <button id="diff-apply" class="act">应用替换</button>
    </header>
    <div id="diff-body"></div>
  </div>
</div>

<!-- 发布弹层 -->
<div id="pub-overlay" class="ovl" hidden>
  <div id="pub-card" class="card">
    <header>复制为发布格式<span class="sp"></span><button id="pub-close" class="act ghost">关闭</button></header>
    <div class="opts">
      <button class="opt" id="pub-wechat">
        <div class="t">公众号 · 带格式</div>
        <div class="s">复制排版好的富文本，直接粘贴进公众号编辑器</div>
      </button>
      <button class="opt" id="pub-xhs">
        <div class="t">小红书 · 纯文本</div>
        <div class="s">去掉 markdown 符号，段落分明，适合直接粘贴</div>
      </button>
    </div>
    <footer>
      <span class="hint">发完了？</span>
      <button id="pub-done" class="act ghost">标记为「已发布」</button>
    </footer>
  </div>
</div>

<!-- 版本历史弹层 -->
<div id="hist-overlay" class="ovl" hidden>
  <div id="hist-card" class="card">
    <header>版本历史<span class="sp"></span><button id="hist-close" class="act ghost">关闭</button></header>
    <div id="hist-body"></div>
  </div>
</div>

<!-- 素材弹层 -->
<div id="mat-overlay" class="ovl" hidden>
  <div id="mat-card" class="card">
    <header>插入素材 · 挑一条当论据<span class="sp"></span><button id="mat-close" class="act ghost">关闭</button></header>
    <div id="mat-body"></div>
  </div>
</div>

<!-- 标题候选弹层 -->
<div id="tt-overlay" class="ovl" hidden>
  <div id="tt-card" class="card">
    <header>选个标题<span class="sp"></span><button id="tt-close" class="act ghost">关闭</button></header>
    <div id="tt-body"></div>
  </div>
</div>

<!-- 平台选择弹层 -->
<div id="pf-overlay" class="ovl" hidden>
  <div id="pf-card" class="card">
    <header>按哪个平台的风格改写？<span class="sp"></span><button id="pf-close" class="act ghost">关闭</button></header>
    <div class="opts">
      <button class="opt" data-pf="公众号"><div class="t">公众号</div><div class="s">阅读节奏 + 小标题分段</div></button>
      <button class="opt" data-pf="知乎"><div class="t">知乎</div><div class="s">论述感 + 逻辑连接词 + 克制</div></button>
      <button class="opt" data-pf="小红书"><div class="t">小红书</div><div class="s">短段落 + 口语 + emoji + 话题标签</div></button>
    </div>
  </div>
</div>

<script>
(function () {
  var topicId = "";
  var version = 0;
  var saving = false;
  var dirty = false; // 有未保存修改：译宝的版本更新不直接冲掉编辑区
  var $ = function (id) { return document.getElementById(id); };

  function setStatus(text, isErr) {
    var s = $("status");
    s.textContent = text;
    s.className = isErr ? "err" : "";
  }
  function emsg(e) { return e && e.message ? e.message : String(e || ""); }

  // ---- 极简 markdown 渲染（标题/粗体/列表/段落；先转义 HTML，不引库）----
  // styled=true 时带内联样式（公众号编辑器只认内联样式；预览用默认 false）
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function inline(s) {
    return esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function md(src, styled) {
    var S = styled ? {
      h1: " style=\"font-size:20px;font-weight:700;margin:18px 0 10px;line-height:1.5\"",
      h2: " style=\"font-size:17px;font-weight:700;margin:16px 0 8px;line-height:1.5\"",
      h3: " style=\"font-size:15px;font-weight:700;margin:14px 0 8px;line-height:1.5\"",
      p: " style=\"font-size:15px;line-height:1.9;margin:0 0 14px;color:#3f3f3f\"",
      ul: " style=\"margin:0 0 14px;padding-left:1.4em\"",
      li: " style=\"font-size:15px;line-height:1.9;color:#3f3f3f\"",
      q: " style=\"margin:0 0 14px;padding:8px 12px;border-left:3px solid #e3d7c4;color:#8a7a66;background:#faf7f2;font-size:14px;line-height:1.8\"",
    } : { h1: "", h2: "", h3: "", p: "", ul: "", li: "", q: "" };
    var out = [], para = [], quote = [], inList = false;
    function flushPara() { if (para.length) { out.push("<p" + S.p + ">" + para.join("<br>") + "</p>"); para = []; } }
    function flushList() { if (inList) { out.push("</ul>"); inList = false; } }
    function flushQuote() { if (quote.length) { out.push("<blockquote" + S.q + ">" + quote.join("<br>") + "</blockquote>"); quote = []; } }
    src.split(/\r?\n/).forEach(function (line) {
      var t = line.trim(), m;
      if ((m = t.match(/^(#{1,3})\s+(.*)$/))) {
        flushPara(); flushList(); flushQuote();
        var lv = m[1].length;
        out.push("<h" + lv + S["h" + lv] + ">" + inline(m[2]) + "</h" + lv + ">");
      } else if ((m = t.match(/^[-*]\s+(.*)$/))) {
        flushPara(); flushQuote();
        if (!inList) { out.push("<ul" + S.ul + ">"); inList = true; }
        out.push("<li" + S.li + ">" + inline(m[1]) + "</li>");
      } else if ((m = t.match(/^>\s?(.*)$/))) {
        flushPara(); flushList();
        quote.push(m[1] ? inline(m[1]) : "");
      } else if (!t) {
        flushPara(); flushList(); flushQuote();
      } else {
        flushList(); flushQuote();
        para.push(inline(t));
      }
    });
    flushPara(); flushList(); flushQuote();
    return out.join("") || "<p style=\"color:#cdbfab\">（预览为空）</p>";
  }

  // ---- 小红书纯文本：去 markdown 符号，保留段落 ----
  function toPlain(src) {
    return src.split(/\r?\n/).map(function (line) {
      var t = line.trim();
      t = t.replace(/^#{1,6}\s*/, "");
      t = t.replace(/^[-*]\s+/, "· ");
      t = t.replace(/\*\*([^*]+)\*\*/g, "$1");
      return t;
    }).join("\n").replace(/\n{3,}/g, "\n\n").trim();
  }

  $("editor").addEventListener("input", function () {
    dirty = true;
    $("preview").innerHTML = md($("editor").value);
  });

  // ---- 返回详情（zimeiti.get 直调回详情页；还没载入选题时退回看板）----
  $("back").addEventListener("click", function () {
    var method = topicId ? "zimeiti.get" : "zimeiti.list";
    var params = topicId ? { id: topicId } : {};
    window.yibao.invoke(method, params).catch(function (e) {
      setStatus("返回失败：" + emsg(e), true);
    });
  });

  // ---- 加载最新稿（read_article 在 api.toml 白名单内；无稿报错属正常起点）----
  function loadArticle(prefix) {
    if (!topicId) { setStatus("没有选题数据", true); return; }
    setStatus("加载稿件…");
    window.yibao.invoke("zimeiti.read_article", { id: topicId }).then(function (r) {
      version = (r && r.version) || 0;
      $("editor").value = (r && r.content) || "";
      $("editor").dispatchEvent(new Event("input"));
      dirty = false; // 程序性加载不算用户修改（input 事件把 dirty 置了 true，这里归位）
      var note = r && r.note;
      setStatus((prefix || "已加载") + " v" + version + (note ? " · " + note : ""));
    }).catch(function (e) {
      var msg = e && e.message ? e.message : String(e || "");
      version = 0;
      $("editor").value = "";
      $("editor").dispatchEvent(new Event("input"));
      dirty = false;
      // 「还没有稿件」是正常起点；其余失败（桥/白名单/超时）必须看得见，别装成空稿
      if (msg.indexOf("还没有稿件") >= 0) setStatus("还没有稿件，喊译宝「写初稿」或直接开写");
      else setStatus("稿件加载失败：" + msg, true);
    });
  }

  // 面板事件 data：打开编辑器时是 zimeiti.get 的 {rows:[选题]}。
  // 同选题 rows 重推 = 译宝在对话里保存了新版本（focus 重定向，loop._panel_with_refresh）→ 刷新稿件；
  // 但编辑区有未保存修改时不冲掉，只在状态栏提示。保存回执等无 rows 形状忽略（不动当前编辑状态）。
  window.yibao.onInit(function (data) {
    var row = data && data.rows && data.rows[0];
    if (!row || !row.id) return;
    var sameTopic = String(row.id) === topicId;
    if (sameTopic && dirty) {
      setStatus("译宝在对话里存了新版本；你有未保存修改，先保存或清空后再载入");
      return;
    }
    topicId = String(row.id);
    $("title").textContent = String(row.title || "写作编辑器");
    loadArticle(sameTopic ? "译宝更新到" : undefined);
  });

  // ---- 保存为新版本（article_save 为 L2，确认条在面板窗顶部弹出，允许后才会执行）----
  $("save").addEventListener("click", function () {
    if (!topicId || saving) return;
    var content = $("editor").value;
    if (!content.trim()) { setStatus("内容为空，没有保存", true); return; }
    saving = true;
    $("save").disabled = true;
    setStatus("保存中…（如弹出确认条请点「允许」）");
    window.yibao.invoke("zimeiti.save_article", {
      id: topicId, content: content, note: $("note").value.trim()
    }).then(function (r) {
      version = (r && r.version) || (version + 1);
      $("note").value = "";
      dirty = false; // 已落盘，不再是未保存修改
      setStatus("已保存为 v" + version);
    }).catch(function (e) {
      setStatus("保存失败：" + emsg(e), true);
    }).finally(function () {
      saving = false;
      $("save").disabled = false;
    });
  });
  // ---- 选段 AI 协作：浮动条 → ai_edit 直调 → diff 预览 → 应用落稿 ----
  var selRange = null;        // {start, end, text}
  var aiBusy = false;
  var pendingReplacement = null;
  var MODE_LABEL = { rewrite: "改写", expand: "扩写", condense: "缩写", custom: "自定义" };

  function hideSelbar() {
    $("selbar").hidden = true;
    $("selbar-custom").hidden = true;
  }

  function onSelect(ev) {
    if (aiBusy || !$("diff-overlay").hidden) return;
    var el = $("editor");
    var s = el.selectionStart, e = el.selectionEnd;
    if (s === e || !el.value.slice(s, e).trim()) { hideSelbar(); selRange = null; return; }
    selRange = { start: s, end: e, text: el.value.slice(s, e) };
    var bar = $("selbar");
    bar.hidden = false;
    if (ev && ev.clientX) {  // 鼠标选中：跟手；键盘 shift 选中：钉在编辑器上方
      bar.style.left = Math.min(ev.clientX, window.innerWidth - 300) + "px";
      bar.style.top = Math.max(8, ev.clientY - 46) + "px";
      bar.style.right = "auto";
    } else {
      bar.style.right = "20px";
      bar.style.top = "56px";
      bar.style.left = "auto";
    }
  }
  $("editor").addEventListener("mouseup", onSelect);
  $("editor").addEventListener("keyup", function (ev) {
    if (ev.key === "Escape") { hideSelbar(); return; }
    if (ev.shiftKey || ev.key === "Shift") onSelect(ev);
  });
  $("editor").addEventListener("input", hideSelbar);

  function setBusy(b) {
    aiBusy = b;
    var btns = $("selbar").querySelectorAll("button");
    for (var i = 0; i < btns.length; i++) btns[i].disabled = b;
  }

  function aiEdit(mode) {
    if (!selRange || aiBusy) return;
    var instruction = mode === "custom" ? $("custom-inst").value.trim() : "";
    if (mode === "custom" && !instruction) {
      $("selbar-custom").hidden = false;
      $("custom-inst").focus();
      return;
    }
    setBusy(true);
    setStatus("AI 正在" + MODE_LABEL[mode] + "…");
    window.yibao.invoke("zimeiti.ai_edit", {
      selection: selRange.text, mode: mode, instruction: instruction,
      context: $("editor").value.slice(0, 3000)
    }).then(function (r) {
      pendingReplacement = (r && r.replacement) || "";
      if (!pendingReplacement) { setStatus("AI 返回了空内容", true); return; }
      var range = { start: selRange.start, end: selRange.end };
      showDiff(MODE_LABEL[mode] || mode, selRange.text, pendingReplacement, "应用替换", function (text) {
        var el = $("editor");
        el.setRangeText(text, range.start, range.end, "end");
        el.dispatchEvent(new Event("input"));
        el.focus();
        setStatus("已替换为 AI 建议 · 满意的话「保存为新版本」");
      });
      setStatus("确认后应用替换");
    }).catch(function (e) {
      setStatus("AI 处理失败：" + emsg(e), true);
    }).finally(function () { setBusy(false); });
  }

  Array.prototype.forEach.call($("selbar").querySelectorAll("button[data-mode]"), function (btn) {
    btn.addEventListener("click", function () { aiEdit(btn.getAttribute("data-mode")); });
  });
  $("custom-inst").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") aiEdit("custom");
  });

  // ---- 全文级 AI 协作：润色/标题/平台改写（整文进 ai_edit，确认后才落稿）----
  function aiFull(mode, platform) {
    if (aiBusy) return;
    var full = $("editor").value.trim();
    if (!full) { setStatus("还没有内容，先写稿", true); return; }
    if (full.length > 8000) { setStatus("文章太长（" + full.length + " 字），先拆段或走对话改稿", true); return; }
    setBusy(true);
    setStatus("AI 处理中…");
    var params = { selection: full, mode: mode };
    if (platform) params.platform = platform;
    window.yibao.invoke("zimeiti.ai_edit", params).then(function (r) {
      if (mode === "title") { showTitles((r && r.titles) || []); return; }
      var rep = (r && r.replacement) || "";
      if (!rep) { setStatus("AI 返回了空内容", true); return; }
      pendingReplacement = rep;
      showDiff(mode === "polish" ? "全文润色" : ("平台改写 · " + platform), full, rep, "应用替换", function (text) {
        var el = $("editor");
        el.value = text;
        el.dispatchEvent(new Event("input"));
        el.focus();
        setStatus("已应用 · 满意的话「保存为新版本」");
      });
      setStatus("确认后应用替换");
    }).catch(function (e) {
      setStatus(emsg(e), true);
    }).finally(function () { setBusy(false); });
  }

  // 标题候选弹层：挑一个替换文首 H1（无 H1 则插到文首）
  function showTitles(titles) {
    if (!titles.length) { setStatus("AI 没给出标题", true); return; }
    $("tt-body").innerHTML = "";
    titles.forEach(function (t) {
      var btn = document.createElement("button");
      btn.className = "mrow";
      btn.innerHTML = "<div class=\"mt\">" + esc(t) + "</div>";
      btn.addEventListener("click", function () {
        var el = $("editor");
        el.value = /^# /.test(el.value) ? el.value.replace(/^# [^\n]*/, "# " + t) : "# " + t + "\n\n" + el.value;
        el.dispatchEvent(new Event("input"));
        $("tt-overlay").hidden = true;
        el.focus();
        setStatus("已换标题 · 满意的话「保存为新版本」");
      });
      $("tt-body").appendChild(btn);
    });
    $("tt-overlay").hidden = false;
    setStatus("挑一个标题，替换文首 H1");
  }

  $("ai-polish").addEventListener("click", function () { aiFull("polish"); });
  $("ai-title").addEventListener("click", function () { aiFull("title"); });
  $("ai-platform").addEventListener("click", function () { $("pf-overlay").hidden = false; });
  $("pf-close").addEventListener("click", function () { $("pf-overlay").hidden = true; });
  $("tt-close").addEventListener("click", function () { $("tt-overlay").hidden = true; });
  Array.prototype.forEach.call(document.querySelectorAll("#pf-overlay .opt"), function (btn) {
    btn.addEventListener("click", function () {
      $("pf-overlay").hidden = true;
      aiFull("platform", btn.getAttribute("data-pf"));
    });
  });

  // 行级 LCS diff（片段不大，O(n·m) 够用）
  function diffLines(a, b) {
    var A = a.split("\n"), B = b.split("\n"), n = A.length, m = B.length;
    var dp = [], i, j;
    for (i = 0; i <= n; i++) { dp.push([]); for (j = 0; j <= m; j++) dp[i].push(0); }
    for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--)
      dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    var out = [];
    i = 0; j = 0;
    while (i < n && j < m) {
      if (A[i] === B[j]) { out.push({ t: "s", s: A[i] }); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push({ t: "d", s: A[i] }); i++; }
      else { out.push({ t: "a", s: B[j] }); j++; }
    }
    for (; i < n; i++) out.push({ t: "d", s: A[i] });
    for (; j < m; j++) out.push({ t: "a", s: B[j] });
    return out;
  }

  var diffApplyFn = null;

  function showDiff(label, oldText, newText, applyLabel, applyFn) {
    $("diff-mode").textContent = label;
    $("diff-apply").textContent = applyLabel;
    var html = diffLines(oldText, newText).map(function (r) {
      return "<div class=\"" + r.t + "\">" + (esc(r.s) || " ") + "</div>";
    }).join("");
    $("diff-body").innerHTML = html;
    $("diff-overlay").hidden = false;
    diffApplyFn = applyFn;
    hideSelbar();
  }

  function closeDiff() {
    $("diff-overlay").hidden = true;
    pendingReplacement = null;
    diffApplyFn = null;
    $("diff-apply").textContent = "应用替换";
  }
  $("diff-cancel").addEventListener("click", function () { closeDiff(); setStatus("已取消，原文未动"); });
  $("diff-apply").addEventListener("click", function () {
    var fn = diffApplyFn, text = pendingReplacement;
    closeDiff();
    if (fn && text !== null) fn(text);
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key !== "Escape") return;
    if (!$("diff-overlay").hidden) closeDiff();
    if (!$("pub-overlay").hidden) $("pub-overlay").hidden = true;
    if (!$("hist-overlay").hidden) $("hist-overlay").hidden = true;
    if (!$("mat-overlay").hidden) $("mat-overlay").hidden = true;
    if (!$("tt-overlay").hidden) $("tt-overlay").hidden = true;
    if (!$("pf-overlay").hidden) $("pf-overlay").hidden = true;
  });

  // ---- 版本历史：列表 → 对比当前稿 → 一键恢复（保存后成为新版本，历史不可变） ----
  function _fmtTs(ts) {
    if (!ts) return "";
    var d = new Date(ts * 1000);
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function compareVersion(v) {
    setStatus("加载 v" + v + " …");
    window.yibao.invoke("zimeiti.read_article", { id: topicId, version: v }).then(function (r) {
      var content = (r && r.content) || "";
      if (!content.trim()) { setStatus("v" + v + " 内容为空", true); return; }
      pendingReplacement = content;
      showDiff("v" + v + " ↔ 当前稿", $("editor").value, content, "恢复为 v" + v, function (text) {
        var el = $("editor");
        el.value = text;
        el.dispatchEvent(new Event("input"));
        el.focus();
        setStatus("已恢复为 v" + v + " · 保存后成为新版本（历史版不会丢）");
      });
      $("hist-overlay").hidden = true;
      setStatus("v" + v + " 与当前稿的差异如下，确认后恢复");
    }).catch(function (e) {
      setStatus("加载 v" + v + " 失败：" + emsg(e), true);
    });
  }

  $("history").addEventListener("click", function () {
    if (!topicId) { setStatus("还没有选题数据", true); return; }
    $("hist-overlay").hidden = false;
    $("hist-body").innerHTML = "<div class=\"hempty\">加载中…</div>";
    window.yibao.invoke("zimeiti.versions", { id: topicId }).then(function (r) {
      var rows = (r && r.rows) || [];
      if (!rows.length) {
        $("hist-body").innerHTML = "<div class=\"hempty\">还没有保存过版本</div>";
        return;
      }
      $("hist-body").innerHTML = rows.map(function (row) {
        return "<div class=\"hrow\"><span class=\"v\">v" + row.version + "</span>" +
          "<span class=\"n\">" + esc(row.note || "（无备注）") + "</span>" +
          "<span class=\"t\">" + _fmtTs(row.created_at) + "</span>" +
          "<button class=\"hcmp\" data-v=\"" + row.version + "\">对比/恢复</button></div>";
      }).join("");
      Array.prototype.forEach.call($("hist-body").querySelectorAll(".hcmp"), function (btn) {
        btn.addEventListener("click", function () { compareVersion(parseInt(btn.getAttribute("data-v"), 10)); });
      });
    }).catch(function (e) {
      $("hist-body").innerHTML = "<div class=\"hempty\">加载失败：" + esc(emsg(e)) + "</div>";
    });
  });
  $("hist-close").addEventListener("click", function () { $("hist-overlay").hidden = true; });

  // ---- 素材抽屉：挑一条当论据，以引用块插到光标处（mat_list 为 L0 直调，rows 含全文）----
  function insertMaterial(row, quote) {
    var el = $("editor");
    var lines = String(quote).split("\n").map(function (s) { return s ? "> " + s : ">"; });
    lines.push(">", "> ——《" + (row.title || "素材") + "》");
    var pos = el.selectionStart != null ? el.selectionStart : el.value.length;
    var before = el.value.slice(0, pos);
    // 引用块自成段落：前文不足一个空行就补齐，文末追加收尾空行
    var head = before ? (/\n\n$/.test(before) ? "" : (/\n$/.test(before) ? "\n" : "\n\n")) : "";
    el.setRangeText(head + lines.join("\n") + "\n\n", pos, pos, "end");
    el.dispatchEvent(new Event("input"));
    $("mat-overlay").hidden = true;
    el.focus();
    setStatus("已插入素材《" + (row.title || "") + "》，满意的话「保存为新版本」");
  }

  function renderMats(rows) {
    if (!rows.length) {
      $("mat-body").innerHTML = "<div class=\"mempty\">素材库还是空的——对译宝说「存一下 + 链接」就有了</div>";
      return;
    }
    $("mat-body").innerHTML = "";
    rows.forEach(function (row) {
      var content = String(row.content || "").trim();
      // 短素材引原文，长素材引摘要（都没有就截 300 字）
      var quote = content && content.length <= 300 ? content
        : (String(row.summary || "").trim() || content.slice(0, 300) + "…");
      var btn = document.createElement("button");
      btn.className = "mrow";
      btn.innerHTML = "<div class=\"mt\">" + (row._linked ? "本选题 · " : "") + esc(row.title || "(无题)") + "</div>" +
        "<div class=\"ms\">" + esc(quote) + "</div>";
      btn.addEventListener("click", function () { insertMaterial(row, quote); });
      $("mat-body").appendChild(btn);
    });
  }

  $("mats").addEventListener("click", function () {
    $("mat-overlay").hidden = false;
    $("mat-body").innerHTML = "<div class=\"mempty\">加载中…</div>";
    // mat_peek = quiet 版 mat_list：只取数不发 panel 事件（否则关联查询的空结果会把素材库面板冲掉）
    var allP = window.yibao.invoke("zimeiti.mat_peek", {});
    // 有选题时先拉关联素材（置顶分组）；关联查询失败/为空静默回退全量
    var linkedP = topicId
      ? window.yibao.invoke("zimeiti.mat_peek", { where: { topic_id: topicId } }).catch(function () { return null; })
      : Promise.resolve(null);
    Promise.all([linkedP, allP]).then(function (rs) {
      var linked = (rs[0] && rs[0].rows) || [];
      var rows = (rs[1] && rs[1].rows) || [];
      var seen = {};
      linked.forEach(function (row) { seen[row.id] = 1; row._linked = 1; });
      renderMats(linked.concat(rows.filter(function (row) { return !seen[row.id]; })));
    }).catch(function (e) {
      $("mat-body").innerHTML = "<div class=\"mempty\">加载失败：" + esc(emsg(e)) + "</div>";
    });
  });
  $("mat-close").addEventListener("click", function () { $("mat-overlay").hidden = true; });

  // ---- 发布：格式化复制（公众号富文本 / 小红书纯文本）+ 标为已发布 ----
  function copyRich(html) {
    // contenteditable 选区 + execCommand：剪贴板同时带 text/html 与 text/plain（沙箱 iframe 内可用）
    var host = document.createElement("div");
    host.contentEditable = "true";
    host.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0;";
    host.innerHTML = html;
    document.body.appendChild(host);
    var range = document.createRange();
    range.selectNodeContents(host);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    sel.removeAllRanges();
    document.body.removeChild(host);
    return ok;
  }

  function copyPlain(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;left:-9999px;opacity:0;";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  $("publish").addEventListener("click", function () {
    if (!$("editor").value.trim()) { setStatus("还没有内容，先写稿", true); return; }
    $("pub-overlay").hidden = false;
  });
  $("pub-close").addEventListener("click", function () { $("pub-overlay").hidden = true; });
  $("pub-wechat").addEventListener("click", function () {
    var ok = copyRich(md($("editor").value, true));
    if (ok) {
      $("pub-overlay").hidden = true;
      setStatus("已复制公众号格式，去公众号编辑器粘贴（⌘V）");
    } else {
      setStatus("复制失败：剪贴板被浏览器拒绝", true);
    }
  });
  $("pub-xhs").addEventListener("click", function () {
    var ok = copyPlain(toPlain($("editor").value));
    if (ok) {
      $("pub-overlay").hidden = true;
      setStatus("已复制纯文本，去小红书粘贴（⌘V）");
    } else {
      setStatus("复制失败：剪贴板被浏览器拒绝", true);
    }
  });
  $("pub-done").addEventListener("click", function () {
    if (!topicId) { setStatus("还没有选题数据", true); return; }
    $("pub-done").disabled = true;
    window.yibao.invoke("zimeiti.set_status", { id: topicId, status: "已发布" }).then(function () {
      $("pub-overlay").hidden = true;
      setStatus("已标记为「已发布」，看板已更新");
    }).catch(function (e) {
      setStatus("标记失败：" + emsg(e), true);
    }).finally(function () { $("pub-done").disabled = false; });
  });
})();
</script>
