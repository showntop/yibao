<!DOCTYPE html>
<!-- 工具箱面板：JSON 格式化 / 文本对比。
     能力调用全部经 window.yibao.invoke（postMessage 桥 → api.toml 白名单 + 风险闸门）。
     桥 JS 由父侧注入（提供 window.yibao.invoke/onInit），本文件不自带。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* 配色对齐译宝主题（tokens.css 语义色，slate + sky 蓝 accent）：
     浅色为默认，深色走 prefers-color-scheme 跟随系统 */
  :root {
    --bg: #f0f4f8; --card: #ffffff;
    --border: rgba(148, 170, 195, 0.22); --border-soft: #edf1f6; --border-strong: #d3dce7;
    --text: #3d4a5c; --muted: #6b7c8f; --faint: #a5b2c2;
    --accent: #4a88c0; --accent-deep: #3a74ab; --accent-soft: rgba(74, 136, 192, 0.12);
    --segment-track: #e3eaf2;
    --green-bg: #e6f4ea; --green: #3e8e5a; --green-bar: #8fd0a6;
    --red-bg: #fdecea; --red: #c0574b; --red-bar: #f0aaa1;
    --warn-bg: #fdf3e0; --warn: #b98a2f;
    --toast-bg: rgba(61, 74, 92, 0.94);
    --mono: 12.5px/1.6 "SF Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161d; --card: #18212b;
      --border: rgba(255, 255, 255, 0.09); --border-soft: rgba(255, 255, 255, 0.06); --border-strong: rgba(255, 255, 255, 0.18);
      --text: #dbe4ee; --muted: #93a3b6; --faint: #6d7f93;
      --accent: #5ea0d2; --accent-deep: #4d90c4; --accent-soft: rgba(77, 144, 196, 0.22);
      --segment-track: rgba(255, 255, 255, 0.1);
      --green-bg: rgba(62, 142, 90, 0.2); --green: #8fd0a6; --green-bar: #6fbf8e;
      --red-bg: rgba(192, 87, 75, 0.2); --red: #f0aaa1; --red-bar: #e38a80;
      --warn-bg: rgba(185, 138, 47, 0.18); --warn: #f0b25c;
      --toast-bg: rgba(219, 228, 238, 0.92);
    }
  }
  html, body { height: 100%; }
  body {
    font: 13px/1.6 -apple-system, "PingFang SC", sans-serif;
    background: var(--bg); color: var(--text); padding: 14px;
    display: flex; flex-direction: column;
  }
  .hidden { display: none !important; }
  #page-json, #page-diff { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  /* ---- 分段控制器（主题 segment 同款：track 石板 + 选中白卡/深卡） ---- */
  .seg {
    display: inline-flex; gap: 2px; padding: 3px; margin-bottom: 14px;
    background: var(--segment-track); border-radius: 11px;
  }
  .seg button {
    border: none; background: transparent; color: var(--muted); cursor: pointer;
    border-radius: 8px; padding: 5px 18px; font-size: 12.5px; font-weight: 500;
    transition: all .15s ease;
  }
  .seg button:hover { color: var(--text); }
  .seg button.on {
    background: var(--card); color: var(--accent-deep); font-weight: 600;
    box-shadow: 0 1px 3px rgba(45, 60, 80, .15);
  }

  /* ---- 卡片 ---- */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 1px 2px rgba(45, 60, 80, .04), 0 6px 16px rgba(45, 60, 80, .05);
    overflow: hidden; margin-bottom: 10px;
  }
  .card-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid var(--border-soft);
    font-size: 12px; font-weight: 600; color: var(--text);
  }
  .card-head .muted { font-weight: 400; color: var(--muted); font-size: 11.5px; }
  .card-head .spacer { flex: 1; }
  button.mini {
    border: none; background: transparent; color: var(--muted); cursor: pointer;
    font-size: 11.5px; padding: 2px 8px; border-radius: 7px; transition: all .15s ease;
  }
  button.mini:hover { background: var(--accent-soft); color: var(--accent-deep); }

  /* ---- 编辑框（textarea + 底层高亮层；平时就是普通 textarea）---- */
  .editor { position: relative; flex: 1; min-height: 0; display: flex; }
  .editor textarea {
    position: relative; z-index: 1; flex: 1;
    display: block; width: 100%; height: 100%; border: none; outline: none; resize: none;
    padding: 10px 12px; background: transparent; color: var(--text);
    font: var(--mono); overflow: auto;
  }
  .editor .hl {
    position: absolute; inset: 0; z-index: 0;
    padding: 10px 12px; overflow: hidden; pointer-events: none;
    font: var(--mono); white-space: pre-wrap; word-break: break-all;
  }
  .editor .hl .l { min-height: 1.6em; }
  .editor .hl .l.add { background: var(--green-bg); box-shadow: inset 3px 0 var(--green-bar); }
  .editor .hl .l.del { background: var(--red-bg); box-shadow: inset 3px 0 var(--red-bar); }
  /* 高亮模式：文字透明、光标保留，让底层高亮透出来；一开始输入就退出该模式 */
  .editor.hl-mode textarea { color: transparent; caret-color: var(--text); }
  .editor.hl-mode textarea::selection { background: rgba(255, 138, 92, .25); }

  /* ---- 工具条 ---- */
  .toolbar { display: flex; align-items: center; gap: 8px; margin: 2px 0 10px; flex-wrap: wrap; }
  .toolbar .spacer { flex: 1; }
  button.act {
    border: none; border-radius: 10px; padding: 6px 16px; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 600;
    box-shadow: 0 2px 6px rgba(242, 112, 63, .3); transition: all .15s ease;
  }
  button.act:hover { background: var(--accent-deep); }
  button.act:active { transform: scale(.97); }
  button.ghost {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    box-shadow: none; font-weight: 500;
  }
  button.ghost:hover { background: var(--accent-soft); color: var(--accent-deep); border-color: var(--border-strong); }
  .opt { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  .opt select {
    border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text);
    font-size: 12px; padding: 3px 6px; outline: none;
  }
  .opt input[type="checkbox"] { accent-color: var(--accent); }
  .hint { font-size: 11px; color: var(--faint); }

  /* ---- 错误横幅 ---- */
  .banner {
    display: flex; align-items: flex-start; gap: 7px;
    border-radius: 11px; padding: 8px 12px; margin-bottom: 10px;
    font-size: 12.5px; line-height: 1.5;
  }
  .banner.err { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-bar); }
  .banner.err::before { content: "⚠"; flex: none; }

  /* ---- 统计徽章 ---- */
  .chips { display: flex; gap: 6px; align-items: center; margin: 2px 0 10px; min-height: 24px; }
  .chip { border-radius: 999px; padding: 2px 11px; font-size: 12px; font-weight: 600; }
  .chip.add { background: var(--green-bg); color: var(--green); }
  .chip.del { background: var(--red-bg); color: var(--red); }
  .chip.eq { background: var(--green-bg); color: var(--green); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }

  .cols { display: flex; gap: 10px; flex: 1; min-height: 0; }
  .cols > .card { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #page-json > .card { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .card-head { flex: none; }
  .toolbar, .chips, .banner, .seg { flex: none; }

  /* ---- toast ---- */
  #toast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(8px);
    background: var(--toast-bg); color: var(--card); font-size: 12px;
    padding: 6px 16px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: all .2s ease;
  }

  /* ---- Unix 时间戳 ---- */
  #page-ts { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 10px; }
  .ts-now { display: flex; align-items: baseline; gap: 6px; padding: 10px 12px; flex-wrap: wrap; }
  .ts-num { font: var(--mono); font-size: 13px; font-weight: 600; color: var(--accent-deep); }
  .ts-local { color: var(--text); font-size: 12.5px; }
  .ts-dot { color: var(--faint); margin: 0 3px; }
  .ts-out { padding: 4px 12px 10px; display: flex; flex-direction: column; }
  .ts-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border-soft); }
  .ts-row:last-child { border-bottom: 0; }
  .ts-k { flex: none; width: 78px; font-size: 11.5px; color: var(--muted); }
  .ts-v { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12px; }
  .ts-v + button.mini { flex: none; }
  #ts-in { font-family: var(--mono); font-size: 12.5px; }

  /* ---- JSON 树视图（节点展开/折叠） ---- */
  .jtree { flex: 1; min-height: 0; overflow: auto; padding: 8px 4px 12px; font: var(--mono); user-select: text; }
  .jt-kids { padding-left: 16px; border-left: 1px solid var(--border-soft); margin-left: 4px; }
  .jt-line { display: flex; align-items: center; gap: 4px; padding: 1.5px 4px; border-radius: 5px; white-space: nowrap; }
  .jt-line:hover { background: var(--border-soft); }
  .jt-line.hit { background: var(--warn-bg); box-shadow: inset 2px 0 var(--warn); }
  .jt-complex { cursor: pointer; }
  .jt-toggle { flex: none; width: 13px; color: var(--faint); font-size: 10px; text-align: center; }
  .jt-k { color: var(--muted); }
  .jt-k.arr { color: var(--faint); }
  .jt-v { color: var(--text); }
  .jt-v.jt-str { color: var(--green); }
  .jt-v.jt-num { color: var(--accent); }
  .jt-v.jt-bool, .jt-v.jt-null { color: var(--warn); }
  .jt-v.jt-punct { color: var(--faint); }
  .jt-summary { color: var(--faint); }

  /* ---- 面板内搜索条（⌘F；Tauri webview 无原生 Find 命令，需自己实现） ---- */
  .find-bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
  .find-bar input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: var(--text); font-size: 12.5px; }
  .find-bar input::placeholder { color: var(--faint); }
  .find-count { flex: none; min-width: 46px; text-align: center; font-size: 11px; color: var(--faint); }
  .find-bar button.mini { flex: none; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="seg">
  <button id="tab-json" class="on">JSON 格式化</button>
  <button id="tab-diff">文本对比</button>
  <button id="tab-ts">时间戳</button>
</div>

<!-- 面板内搜索（⌘F 唤起；Tauri webview 无原生 Find，需面板自实现） -->
<div class="find-bar hidden" id="find-bar">
  <input id="find-input" placeholder="在工具箱中查找…" spellcheck="false" />
  <span class="find-count" id="find-count"></span>
  <button class="mini" id="find-prev" title="上一个 (⇧⏎)">↑</button>
  <button class="mini" id="find-next" title="下一个 (⏎)">↓</button>
  <button class="mini" id="find-close" title="关闭 (Esc)">×</button>
</div>

<!-- JSON -->
<div id="page-json">
  <div class="card">
    <div class="card-head">
      JSON <span class="muted" id="json-in-count"></span>
      <span class="spacer"></span>
      <button class="mini" id="json-mode-tree" title="节点展开/折叠查看">树视图</button>
      <button class="mini" id="json-mode-text" hidden>文本</button>
      <button class="mini" id="json-paste">⧉ 粘贴</button>
      <button class="mini" id="json-sample">示例</button>
      <button class="mini" id="json-copy">⧉ 复制</button>
    </div>
    <div class="editor" id="json-editor">
      <textarea id="json-in" rows="12" spellcheck="false"
        placeholder="粘贴 JSON，或对译宝说「格式化这段 JSON」；点「格式化」后就地美化"></textarea>
    </div>
    <div class="jtree hidden" id="json-tree"></div>
  </div>
  <div class="toolbar">
    <button class="act" id="json-pretty">格式化</button>
    <button class="act ghost" id="json-minify">压缩</button>
    <button class="act ghost" id="json-unescape">去除转义</button>
    <button class="act ghost" id="json-escape">添加转义</button>
    <label class="opt">缩进
      <select id="json-indent"><option>2</option><option>4</option></select>
    </label>
    <label class="opt"><input type="checkbox" id="json-sort"> 键排序</label>
    <span class="spacer"></span>
    <span class="hint">⌘⏎ 格式化</span>
    <button class="act ghost" id="json-clear">清空</button>
  </div>
  <div class="banner err hidden" id="json-err"></div>
</div>

<!-- Diff -->
<div id="page-diff" class="hidden">
  <div class="cols">
    <div class="card">
      <div class="card-head">原文 <span class="muted" id="diff-old-count"></span></div>
      <div class="editor" id="ed-old">
        <div class="hl hidden" id="hl-old"></div>
        <textarea id="diff-old" rows="9" spellcheck="false" placeholder="粘贴旧文本，如 v1 草稿"></textarea>
      </div>
    </div>
    <div class="card">
      <div class="card-head">新文 <span class="muted" id="diff-new-count"></span></div>
      <div class="editor" id="ed-new">
        <div class="hl hidden" id="hl-new"></div>
        <textarea id="diff-new" rows="9" spellcheck="false" placeholder="粘贴新文本，如 v2 修改稿"></textarea>
      </div>
    </div>
  </div>
  <div class="toolbar">
    <button class="act" id="diff-run">对比</button>
    <button class="act ghost" id="diff-swap">⇄ 交换</button>
    <span class="spacer"></span>
    <span class="hint">⌘⏎ 对比 · 改动任意内容即还原高亮</span>
    <button class="act ghost" id="diff-clear">清空</button>
  </div>
  <div class="chips" id="diff-stat"></div>
</div>

<!-- Unix 时间戳 -->
<div id="page-ts" class="hidden">
  <div class="card">
    <div class="card-head">当前时间 <span class="muted">实时</span>
      <span class="spacer"></span>
      <button class="mini" id="ts-copy-now-s">复制秒</button>
      <button class="mini" id="ts-copy-now-ms">复制毫秒</button>
    </div>
    <div class="ts-now">
      <span id="ts-now-s" class="ts-num"></span><span class="hint">秒</span>
      <span class="ts-dot">·</span>
      <span id="ts-now-ms" class="ts-num"></span><span class="hint">毫秒</span>
      <span class="ts-dot">·</span>
      <span id="ts-now-local" class="ts-local"></span>
    </div>
  </div>
  <div class="card">
    <div class="card-head">转换 <span class="muted">秒/毫秒/ISO/可读 自动识别</span></div>
    <div class="editor" style="flex: none; height: auto; min-height: 0;">
      <textarea id="ts-in" rows="2" spellcheck="false"
        placeholder="1736342400 或 2025-01-08T16:00:00Z"></textarea>
    </div>
    <div class="toolbar">
      <button class="act" id="ts-run">转换</button>
      <button class="act ghost" id="ts-fill-now">填入当前时间</button>
      <span class="spacer"></span>
      <span class="hint">输入即转</span>
    </div>
  </div>
  <div class="banner err hidden" id="ts-err"></div>
  <div class="card hidden" id="ts-out-card">
    <div class="card-head">结果</div>
    <div class="ts-out">
      <div class="ts-row"><span class="ts-k">秒</span><span class="ts-v" id="ts-o-s"></span><button class="mini" data-copy="ts-o-s">复制</button></div>
      <div class="ts-row"><span class="ts-k">毫秒</span><span class="ts-v" id="ts-o-ms"></span><button class="mini" data-copy="ts-o-ms">复制</button></div>
      <div class="ts-row"><span class="ts-k">ISO (UTC)</span><span class="ts-v" id="ts-o-iso"></span><button class="mini" data-copy="ts-o-iso">复制</button></div>
      <div class="ts-row"><span class="ts-k">本地可读</span><span class="ts-v" id="ts-o-local"></span><button class="mini" data-copy="ts-o-local">复制</button></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  function $(id) { return document.getElementById(id); }
  function show(el) { el.classList.remove("hidden"); }
  function hide(el) { el.classList.add("hidden"); }

  // ---- toast ----
  var toastTimer = null;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1400);
  }

  // ---- 字数统计 ----
  function bindCount(taId, labelId) {
    var ta = $(taId);
    function upd() {
      $(labelId).textContent = ta.value ? ta.value.length + " 字" : "";
    }
    ta.addEventListener("input", upd);
    return upd;
  }
  var updJsonIn = bindCount("json-in", "json-in-count");
  var updOld = bindCount("diff-old", "diff-old-count");
  var updNew = bindCount("diff-new", "diff-new-count");

  // ---- 页签 ----
  var tool = "json";
  function showTab(t) {
    tool = t;
    $("tab-json").className = t === "json" ? "on" : "";
    $("tab-diff").className = t === "diff" ? "on" : "";
    $("tab-ts").className = t === "timestamp" ? "on" : "";
    $("page-json").className = t === "json" ? "" : "hidden";
    $("page-diff").className = t === "diff" ? "" : "hidden";
    $("page-ts").className = t === "timestamp" ? "" : "hidden";
  }
  $("tab-json").addEventListener("click", function () { showTab("json"); });
  $("tab-diff").addEventListener("click", function () { showTab("diff"); });
  $("tab-ts").addEventListener("click", function () { showTab("timestamp"); });

  // ---- Unix 时间戳：当前时间实时刷新 + 输入即转（纯前端，无需后端） ----
  var tsTimer = null;
  function tickTs() {
    var t = Date.now();
    $("ts-now-s").textContent = String(Math.floor(t / 1000));
    $("ts-now-ms").textContent = String(t);
    $("ts-now-local").textContent = new Date(t).toLocaleString("zh-CN", { hour12: false });
  }
  tickTs();
  tsTimer = setInterval(tickTs, 1000);

  // 解析输入：10 位=秒 / 13 位=毫秒 / 其他数字按秒；否则按 ISO/可读日期
  function tsParse(v) {
    v = v.trim();
    if (/^\d+$/.test(v)) {
      var n = parseInt(v, 10);
      var d = v.length === 13 ? new Date(n) : new Date(n * 1000);
      return isNaN(d.getTime()) ? null : d;
    }
    var d = new Date(v);
    return isNaN(d.getTime()) ? null : d;
  }
  function renderTs(d) {
    $("ts-o-s").textContent = String(Math.floor(d.getTime() / 1000));
    $("ts-o-ms").textContent = String(d.getTime());
    $("ts-o-iso").textContent = d.toISOString();
    $("ts-o-local").textContent = d.toLocaleString("zh-CN", { hour12: false });
    show($("ts-out-card"));
  }
  function runTs() {
    hide($("ts-err"));
    var v = $("ts-in").value;
    var d = tsParse(v);
    if (!d) {
      $("ts-err").textContent = "无法解析：应为 10 位秒 / 13 位毫秒 / ISO 8601 / 可读日期";
      show($("ts-err"));
      hide($("ts-out-card"));
      return;
    }
    renderTs(d);
  }
  $("ts-run").addEventListener("click", runTs);
  $("ts-in").addEventListener("input", runTs);
  $("ts-in").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); runTs(); }
  });
  $("ts-fill-now").addEventListener("click", function () {
    $("ts-in").value = String(Math.floor(Date.now() / 1000));
    runTs(); toast("已填入当前时间（秒）");
  });
  $("ts-copy-now-s").addEventListener("click", function () { copyText(String(Math.floor(Date.now() / 1000))); });
  $("ts-copy-now-ms").addEventListener("click", function () { copyText(String(Date.now())); });
  document.querySelectorAll("[data-copy]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var el = $(btn.getAttribute("data-copy"));
      if (el && el.textContent) copyText(el.textContent);
    });
  });

  // ---- 编辑框内替换文本（尽量走 insertText 保留撤销栈）----
  function replaceText(ta, text) {
    ta.focus();
    ta.setSelectionRange(0, ta.value.length);
    var ok = false;
    try { ok = document.execCommand("insertText", false, text); } catch (e) { /* 忽略 */ }
    if (!ok) {
      ta.value = text;
      ta.dispatchEvent(new Event("input"));
    }
    ta.setSelectionRange(0, 0);
  }

  // ---- JSON 树视图（节点展开/折叠，惰性渲染） ----
  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  // 惰性：对象/数组先渲染折叠行（摘要），点开才递归建子节点——大 JSON 首屏不卡。
  // autoExpand=true 时默认展开该节点（递归全展开）；超大节点（>60 键）仍折叠防卡；
  // 手动点开的分支子节点默认折叠（保持可控）。
  function buildJsonNode(value, key, isArrItem, autoExpand) {
    var wrap = document.createElement("div");
    wrap.className = "jt-node";
    var isObj = value && typeof value === "object" && !Array.isArray(value);
    var isArr = Array.isArray(value);
    if (isObj || isArr) {
      var keys = Object.keys(value);
      var summary = (isArr ? "[ " : "{ ") + keys.length + (isArr ? " ]" : " }");
      var line = document.createElement("div");
      line.className = "jt-line jt-complex";
      line.innerHTML =
        '<span class="jt-toggle">▸</span>' +
        (key ? '<span class="jt-k' + (isArrItem ? " arr" : "") + '">' + escapeHtml(key) + ":</span> " : "") +
        '<span class="jt-v jt-punct">' + (isArr ? "[" : "{") + "</span>" +
        '<span class="jt-summary">' + summary + "</span>" +
        '<span class="jt-v jt-punct">' + (isArr ? "]" : "}") + "</span>";
      var box = document.createElement("div");
      box.className = "jt-kids";
      var expanded = autoExpand && keys.length <= 60;
      box.style.display = expanded ? "" : "none";
      if (expanded) {
        keys.forEach(function (k) { box.appendChild(buildJsonNode(value[k], k, isArr, true)); });
        line.querySelector(".jt-toggle").textContent = "▾";
      }
      wrap.appendChild(line);
      wrap.appendChild(box);
      line.addEventListener("click", function () {
        var isOpen = box.style.display !== "none";
        line.querySelector(".jt-toggle").textContent = isOpen ? "▸" : "▾";
        box.style.display = isOpen ? "none" : "";
        if (!isOpen && !box.children.length) {
          keys.forEach(function (k) { box.appendChild(buildJsonNode(value[k], k, isArr, false)); });
        }
      });
    } else {
      var t = typeof value, cls = "jt-str", text = JSON.stringify(value);
      if (value === null) { cls = "jt-null"; text = "null"; }
      else if (t === "number") cls = "jt-num";
      else if (t === "boolean") cls = "jt-bool";
      var line2 = document.createElement("div");
      line2.className = "jt-line";
      line2.innerHTML =
        (key ? '<span class="jt-k' + (isArrItem ? " arr" : "") + '">' + escapeHtml(key) + ":</span> " : "") +
        '<span class="jt-v ' + cls + '">' + escapeHtml(text) + "</span>";
      wrap.appendChild(line2);
    }
    return wrap;
  }
  function jtreeRender(obj) {
    var el = $("json-tree");
    el.innerHTML = "";
    el.appendChild(buildJsonNode(obj, null, false, true)); // 默认全展开
  }
  // 展开全部折叠节点（搜索前用，保证能搜到折叠内容）
  function expandAllJsonTree() {
    var guard = 0;
    while (guard++ < 80) {
      var any = false;
      document.querySelectorAll("#json-tree .jt-complex").forEach(function (c) {
        var box = c.nextElementSibling;
        if (box && box.style.display === "none") { c.click(); any = true; }
      });
      if (!any) break;
    }
  }

  var jsonMode = "text"; // text | tree
  function setJsonMode(mode, obj) {
    jsonMode = mode;
    var isTree = mode === "tree";
    // 树模式必须把整个 .editor 容器一起隐藏——它和 .jtree 是同级 flex:1 兄弟，
    // 不隐藏 .editor 会让 .jtree 被挤到下半部分（textarea display:none 但容器仍占 flex 空间）。
    isTree ? hide($("json-editor")) : show($("json-editor"));
    isTree ? show($("json-tree")) : hide($("json-tree"));
    $("json-mode-tree").hidden = isTree;
    $("json-mode-text").hidden = !isTree;
    if (isTree && obj !== undefined) jtreeRender(obj);
    else if (!isTree) $("json-tree").innerHTML = "";
  }
  $("json-mode-tree").addEventListener("click", function () {
    try { setJsonMode("tree", JSON.parse($("json-in").value)); }
    catch (e) { toast("当前不是合法 JSON，无法切换树视图"); }
  });
  $("json-mode-text").addEventListener("click", function () { setJsonMode("text"); });

  // ---- 面板内搜索（⌘F；Tauri webview 无原生 Find 命令，面板自实现） ----
  var findQ = "", findMatches = [], findIdx = -1;
  function findTarget() {
    if (tool === "json" && jsonMode === "tree") return "tree";
    if (tool === "json") return $("json-in");
    if (tool === "diff") return (document.activeElement === $("diff-new")) ? $("diff-new") : $("diff-old");
    return $("ts-in");
  }
  function clearHits() {
    document.querySelectorAll("#json-tree .jt-line.hit").forEach(function (el) { el.classList.remove("hit"); });
  }
  function doFind(dir) {
    var q = $("find-input").value;
    if (q !== findQ) { findQ = q; findIdx = -1; } // 查询变化重置导航
    var t = findTarget();
    if (t === "tree") {
      clearHits();
      if (!q) { $("find-count").textContent = ""; findMatches = []; return; }
      expandAllJsonTree();
      var lines = Array.prototype.slice.call(document.querySelectorAll("#json-tree .jt-line"));
      findMatches = lines.filter(function (l) { return l.textContent.toLowerCase().indexOf(q.toLowerCase()) !== -1; });
      if (!findMatches.length) { $("find-count").textContent = "0/0"; return; }
      findIdx = dir === "prev"
        ? (findIdx < 0 ? findMatches.length - 1 : findIdx - 1)
        : (findIdx + 1 >= findMatches.length ? 0 : findIdx + 1);
      var m = findMatches[findIdx];
      m.classList.add("hit");
      m.scrollIntoView({ block: "nearest" });
      $("find-count").textContent = (findIdx + 1) + "/" + findMatches.length;
    } else if (t && t.tagName === "TEXTAREA") {
      var text = t.value, lower = text.toLowerCase(), lq = q.toLowerCase();
      if (!lq) { $("find-count").textContent = ""; return; }
      var count = 0, i2 = -1;
      while ((i2 = lower.indexOf(lq, i2 + 1)) !== -1) count++;
      if (!count) { $("find-count").textContent = "0/0"; return; }
      var start = dir === "prev" ? (t.selectionStart - 1) : (t.selectionEnd || 0);
      var pos = dir === "prev" ? lower.lastIndexOf(lq, start) : lower.indexOf(lq, start);
      if (pos === -1) pos = dir === "prev" ? lower.lastIndexOf(lq) : lower.indexOf(lq);
      t.setSelectionRange(pos, pos + lq.length);
      try { t.focus({ preventScroll: true }); } catch (e) { t.focus(); }
      // 粗略滚动到光标行附近
      var lineNo = (text.slice(0, pos).match(/\n/g) || []).length;
      t.scrollTop = Math.max(0, (lineNo - 2) * 19);
      $("find-count").textContent = count + " 处";
    }
  }
  function openFind() {
    show($("find-bar"));
    $("find-input").focus();
    $("find-input").select();
  }
  function closeFind() {
    hide($("find-bar"));
    $("find-input").value = "";
    $("find-count").textContent = "";
    clearHits();
    findQ = ""; findMatches = []; findIdx = -1;
  }
  $("find-input").addEventListener("input", function () { findQ = ""; doFind("next"); });
  $("find-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); doFind(e.shiftKey ? "prev" : "next"); }
    else if (e.key === "Escape") closeFind();
  });
  $("find-prev").addEventListener("click", function () { doFind("prev"); });
  $("find-next").addEventListener("click", function () { doFind("next"); });
  $("find-close").addEventListener("click", closeFind);
  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f") {
      e.preventDefault();
      openFind();
    }
    if (e.key === "Escape" && !$("find-bar").classList.contains("hidden")) closeFind();
  });

  // ---- JSON：就地格式化 ----
  function runJson(mode) {
    hide($("json-err"));
    window.yibao.invoke("toolbox.json_format", {
      text: $("json-in").value, mode: mode,
      indent: parseInt($("json-indent").value, 10),
      sort_keys: $("json-sort").checked
    }).then(function (r) {
      var out = (r && r.output) || "";
      if (out && out !== $("json-in").value) replaceText($("json-in"), out);
      // 格式化/压缩出合法 JSON 后自动切树视图（可折叠浏览）
      if (mode === "pretty" || mode === "minify") {
        try { setJsonMode("tree", JSON.parse(out)); return; } catch (e) { /* 非 JSON 文本保持文本模式 */ }
      }
      toast({pretty: "已格式化", minify: "已压缩",
             escape: "已添加转义", unescape: "已去除转义"}[mode] || "完成");
    }).catch(function (e) {
      $("json-err").textContent = e && e.message ? e.message : String(e || "失败");
      show($("json-err"));
    });
  }
  $("json-pretty").addEventListener("click", function () { runJson("pretty"); });
  $("json-minify").addEventListener("click", function () { runJson("minify"); });
  $("json-unescape").addEventListener("click", function () { runJson("unescape"); });
  $("json-escape").addEventListener("click", function () { runJson("escape"); });
  // 树模式下这些编辑操作要先回文本模式（textarea 被隐藏）
  $("json-clear").addEventListener("click", function () {
    setJsonMode("text");
    $("json-in").value = ""; updJsonIn(); hide($("json-err"));
  });
  $("json-copy").addEventListener("click", function () {
    copyText(jsonMode === "tree" ? JSON.stringify(JSON.parse($("json-in").value), null, parseInt($("json-indent").value, 10)) : $("json-in").value);
  });
  $("json-paste").addEventListener("click", function () {
    if (!navigator.clipboard || !navigator.clipboard.readText) { toast("读不到剪贴板"); return; }
    navigator.clipboard.readText().then(function (s) {
      if (s) { setJsonMode("text"); $("json-in").value = s; updJsonIn(); toast("已粘贴"); }
    }, function () { toast("读不到剪贴板"); });
  });
  $("json-sample").addEventListener("click", function () {
    setJsonMode("text");
    $("json-in").value = '{"name":"译宝","tags":["桌宠","AI"],"meta":{"version":2,"plugins":4}}';
    updJsonIn();
    hide($("json-err"));
    toast("已填入示例，点「格式化」试试");
  });

  // ---- Diff：两个编辑框内高亮（底层 .hl 染行，上层文字透明）----
  // 编辑框的 .hl 层逐行染红（原文被删行）/绿（新文新增行）；滚动与 textarea 同步。
  function syncScroll(ta, hl) {
    hl.scrollTop = ta.scrollTop;
    hl.scrollLeft = ta.scrollLeft;
  }
  function clearHl(ed, hl) {
    ed.classList.remove("hl-mode");
    hl.innerHTML = "";
    hide(hl);
  }
  // marks: 与 textarea 行一一对应的 "add"|"del"|null 数组
  function paintHl(ed, ta, hl, marks) {
    var lines = ta.value.split("\n");
    var frag = document.createDocumentFragment();
    var any = false;
    for (var i = 0; i < lines.length; i++) {
      var div = document.createElement("div");
      div.className = "l" + (marks[i] ? " " + marks[i] : "");
      if (marks[i]) any = true;
      div.textContent = lines[i] || " ";
      frag.appendChild(div);
    }
    hl.innerHTML = "";
    hl.appendChild(frag);
    if (any) {
      show(hl);
      ed.classList.add("hl-mode");
      syncScroll(ta, hl);
    } else {
      clearHl(ed, hl);
    }
  }
  var edOld = $("ed-old"), edNew = $("ed-new");
  var hlOld = $("hl-old"), hlNew = $("hl-new");
  var taOld = $("diff-old"), taNew = $("diff-new");
  taOld.addEventListener("scroll", function () { syncScroll(taOld, hlOld); });
  taNew.addEventListener("scroll", function () { syncScroll(taNew, hlNew); });
  taOld.addEventListener("input", function () { clearHl(edOld, hlOld); clearHl(edNew, hlNew); });
  taNew.addEventListener("input", function () { clearHl(edOld, hlOld); clearHl(edNew, hlNew); });

  function renderDiff(data) {
    var stat = $("diff-stat");
    stat.innerHTML = "";
    function chip(cls, text) {
      var s = document.createElement("span");
      s.className = "chip " + cls;
      s.textContent = text;
      stat.appendChild(s);
    }
    if (data.identical) {
      chip("eq", "✓ 两段文本一致");
      clearHl(edOld, hlOld); clearHl(edNew, hlNew);
      return;
    }
    chip("add", "+" + data.added);
    chip("del", "−" + data.removed);
    if (data.truncated) chip("warn", "结果过大，已截断");
    // 把顺序 lines 折算成两侧各自的行标记
    var marksOld = [], marksNew = [];
    (data.lines || []).forEach(function (l) {
      if (l.t === "del") marksOld.push("del");
      else if (l.t === "add") marksNew.push("add");
      else { marksOld.push(null); marksNew.push(null); }
    });
    paintHl(edOld, taOld, hlOld, marksOld);
    paintHl(edNew, taNew, hlNew, marksNew);
  }
  function runDiff() {
    $("diff-stat").innerHTML = "";
    window.yibao.invoke("toolbox.text_diff", {
      old: taOld.value, new: taNew.value
    }).then(function (r) {
      renderDiff(r || {});
    }).catch(function (e) {
      var s = document.createElement("span");
      s.className = "chip del";
      s.textContent = e && e.message ? e.message : String(e || "失败");
      $("diff-stat").innerHTML = "";
      $("diff-stat").appendChild(s);
    });
  }
  $("diff-run").addEventListener("click", runDiff);
  $("diff-swap").addEventListener("click", function () {
    var t = taOld.value;
    taOld.value = taNew.value;
    taNew.value = t;
    updOld(); updNew();
    clearHl(edOld, hlOld); clearHl(edNew, hlNew);
  });
  $("diff-clear").addEventListener("click", function () {
    taOld.value = ""; taNew.value = "";
    updOld(); updNew();
    $("diff-stat").innerHTML = "";
    clearHl(edOld, hlOld); clearHl(edNew, hlNew);
  });

  // ---- 快捷键：⌘/Ctrl + Enter 执行当前页主操作 ----
  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
      e.preventDefault();
      if (tool === "json") runJson("pretty");
      else if (tool === "diff") runDiff();
      else runTs();
    }
  });

  function copyText(text) {
    if (!text) { toast("没有可复制的内容"); return; }
    function ok() { toast("已复制"); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, fallback);
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); ok(); } catch (e) { toast("复制失败"); }
      document.body.removeChild(ta);
    }
  }

  // ---- 面板事件：对话流（LLM 调 skill 带 panel）打开时已带数据 ----
  // 桥内直调也会重发同样的 panel 事件：仅在编辑框未偏离 skill 输入时应用结果，
  // 避免覆盖用户后续编辑。
  window.yibao.onInit(function (data) {
    if (!data || !data.tool) return;
    showTab(data.tool === "diff" ? "diff" : data.tool === "timestamp" ? "timestamp" : "json");
    if (data.tool === "json") {
      var cur = $("json-in").value;
      if (typeof data.output === "string" && data.output &&
          (cur === "" || cur === data.input)) {
        // 空框（对话流带入）或仍停留在待格式化的原文（直调回显）→ 就地应用结果
        $("json-in").value = data.output;
        updJsonIn();
        hide($("json-err"));
      } else if (typeof data.input === "string" && cur === "") {
        $("json-in").value = data.input;
        updJsonIn();
      }
    } else if (data.tool === "diff") {
      if (typeof data.old === "string" && taOld.value === "") { taOld.value = data.old; updOld(); }
      if (typeof data.new === "string" && taNew.value === "") { taNew.value = data.new; updNew(); }
      if (data.lines && taOld.value === (data.old || "") && taNew.value === (data.new || "")) {
        renderDiff(data); // 内容未偏离才画高亮，否则丢掉过时结果
      }
    } else if (data.tool === "timestamp") {
      // 对话流带结果回显：输入未偏离才填入，避免覆盖用户后续编辑
      if (typeof data.input === "string" &&
          ($("ts-in").value === "" || $("ts-in").value === data.input)) {
        $("ts-in").value = data.input;
      }
      if (data.seconds) {
        $("ts-o-s").textContent = data.seconds;
        $("ts-o-ms").textContent = data.millis;
        $("ts-o-iso").textContent = data.iso;
        $("ts-o-local").textContent = data.local;
        show($("ts-out-card"));
      }
    }
  });
})();
</script>
</body>
</html>
