# 面板可调方法白名单（v2 §7）：direct 直调过闸门不过 LLM
[[method]]
name = "task_list"
handler = "agents.task_list"
direct = true

# 插件页/启动器点击卡片约定调 <pid>.list（fun/zimeiti/notes/reminders/toolbox 均有）
[[method]]
name = "list"
handler = "agents.task_list"
direct = true

[[method]]
name = "task_status"
handler = "agents.task_status"
direct = true

[[method]]
name = "task_stop"
handler = "agents.task_stop"
direct = true
refresh = "agents.task_list"   # 停止后面板拿刷新后的任务列表，而非回执
