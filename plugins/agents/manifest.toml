# 智能体调度：把任务派给本机 CLI 智能体（Claude Code / Codex）后台执行，完成主动汇报。
# dispatch_task（代码 tool，L3 走确认）spawn 子进程后立即返回；daemon 线程等进程结束，
# 落库 + 经 ctx.emit_event 播报结果。任务列表/详情/停止走面板。
id = "agents"
name = "智能体调度"
description = "干活任务中心，两条通道：①步骤明确的一次性任务（统计/转换/整理/小计算/生成文件）→ code_exec 沙箱脚本，秒级免费；②需要自主多轮决策的开放任务（修 bug/写功能/重构/代码库调研）→ dispatch_task 派给 Claude Code/Codex，分钟级烧额度。完成都主动播报"
capabilities = ["db", "process"]   # process：本插件会 spawn 子进程（CLI 智能体）

[code]
entry = "tools"

[[table]]
name = "tasks"
columns = [
  {name = "id", type = "text", pk = true},
  {name = "kind", type = "text", default = "agent"},   # agent=CLI 智能体；script=沙箱脚本（code_exec）
  {name = "agent", type = "text"},
  {name = "prompt", type = "text"},
  {name = "cwd", type = "text"},
  {name = "status", type = "text", default = "running"},
  {name = "exit_code", type = "integer", default = -1},
  {name = "pid", type = "integer", default = 0},   # 子进程 pid：底座重启后对账在跑任务用
  {name = "log_path", type = "text", default = ""},
  {name = "created_at", type = "integer"},
  {name = "finished_at", type = "integer", default = 0},
]
indexes = ["status", "created_at"]

[[tool]]
id = "task_list"
type = "db"
description = "列出派给智能体的任务（按时间倒序）"
risk = "L0"
panel = "agents:tasks"
explicit = true   # 对话点名「任务动态」→ 宿主可弹面板
[tool.db]
op = "query"
table = "tasks"
order = "created_at DESC"
limit = 50

[[panel]]
type = "schema"
name = "tasks"
label = "任务列表"
src = "panel/tasks.schema.json"

# 主屏 widget（OS 感 §4.2）：任务动态一瞥卡；method 供数据（L0），open 点击跳任务列表
[[panel]]
type = "widget"
name = "widget"
label = "任务动态"
src = "panel/widget.schema.json"
method = "task_list"
open = "task_list"
