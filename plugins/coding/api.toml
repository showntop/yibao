[[method]]
name = "coding.start"
handler = "coding.start"
direct = true
panel = "coding:chat"

[[method]]
name = "coding.send"
handler = "coding.send"
direct = true
panel = "coding:chat"

[[method]]
name = "coding.stop"
handler = "coding.stop"
direct = true

[[method]]
name = "coding.list"
handler = "coding.list"
direct = true
panel = "coding:chat"

[[method]]
name = "coding.handoff_list"
handler = "coding.handoff_list"
direct = true

[[method]]
name = "coding.handoff_brief"
handler = "coding.handoff_brief"
direct = true

# 历史抽屉：读会话最近消息（只读；quiet 不发 panel 事件——抽屉已在面板内）
[[method]]
name = "history"
handler = "coding.history"
direct = true
quiet = true

# 面板 mode pill：切换权限模式（落库 + 运行中切换；quiet 不发 panel 事件）
[[method]]
name = "mode"
handler = "coding.mode"
direct = true
quiet = true

# 用户气泡 ⏪：文件检查点回滚（quiet 不发 panel 事件）
[[method]]
name = "rewind"
handler = "coding.rewind"
direct = true
quiet = true
