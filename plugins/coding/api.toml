[[method]]
name = "coding.start"
handler = "coding.start"
direct = true
panel = "coding:studio"

[[method]]
name = "coding.send"
handler = "coding.send"
direct = true
panel = "coding:studio"

[[method]]
name = "coding.stop"
handler = "coding.stop"
direct = true

[[method]]
name = "coding.list"
handler = "coding.list"
direct = true
panel = "coding:studio"

# 任务卡/会话墙「接管」：打开 coding:studio 面板并恢复该会话（data 透传 {session_id, attach:true} → 面板 init 自动 resume）
[[method]]
name = "coding.attach"
handler = "coding.attach"
direct = true
panel = "coding:studio"

# 会话墙：多会话总览（schema list 面板；插件页子入口 open="wall_data" 直调打开）
[[method]]
name = "coding.wall_data"
handler = "coding.wall_data"
direct = true
panel = "coding:wall"

# 会话墙行内「停止」：同 handler 复用 coding.stop，refresh 回刷会话墙拿最新卡片
# （仿 zimeiti.hot_add 同 handler 多入口先例；不给 coding.stop 本体加 refresh——chat 面板里停止不该把用户甩到会话墙）
[[method]]
name = "coding.wall_stop"
handler = "coding.stop"
direct = true
refresh = "coding.wall_data"

[[method]]
name = "coding.handoff_list"
handler = "coding.handoff_list"
direct = true

[[method]]
name = "coding.handoff_brief"
handler = "coding.handoff_brief"
direct = true

# 历史抽屉：读会话最近消息（只读；quiet 不发 panel 事件——抽屉已在面板内）
[[method]]
name = "history"
handler = "coding.history"
direct = true
quiet = true

# 面板 mode pill：切换权限模式（落库 + 运行中切换；quiet 不发 panel 事件）
[[method]]
name = "mode"
handler = "coding.mode"
direct = true
quiet = true

# 用户气泡 ⏪：文件检查点回滚（quiet 不发 panel 事件）
[[method]]
name = "rewind"
handler = "coding.rewind"
direct = true
quiet = true

# 权限审批卡按钮：允许/拒绝（quiet 不发 panel 事件）
[[method]]
name = "decide"
handler = "coding.decide"
direct = true
quiet = true

# @ 补全：项目文件模糊搜索（quiet 不发 panel 事件）
[[method]]
name = "files"
handler = "coding.files"
direct = true
quiet = true

# 统一接续 popover：跨源上次会话检测（只读；quiet 不发 panel 事件——popover 内调用，不开面板）
[[method]]
name = "last_sessions"
handler = "coding.last_sessions"
direct = true
quiet = true

# 统一接续 popover：DB 外 cc 会话导入续聊（幂等；quiet 不发 panel 事件——popover 内调用，不开面板）
[[method]]
name = "attach_cc"
handler = "coding.attach_cc"
direct = true
quiet = true

# ctx-row 引擎 chip：可用引擎探测（quiet 不发 panel 事件——chip 初始化直调，不开面板）
[[method]]
name = "drivers"
handler = "coding.drivers"
direct = true
quiet = true

# 接续 popover codex 卡「原生续」：codex thread_id 登记入库（幂等；quiet 不发 panel 事件）
[[method]]
name = "attach_codex"
handler = "coding.attach_codex"
direct = true
quiet = true

# 主输入条 @ 引用：取最近会话 cwd 用（quiet 别名——coding.list 本体带 panel="coding:studio" 事件，
# 主输入条/非 coding 场景调用会把插件页顶成 coding 面板；照 last_sessions/history 的 quiet 别名先例）
[[method]]
name = "sessions"
handler = "coding.list"
direct = true
quiet = true

# 引擎 chip 跨引擎切换：会话库任意会话的交接 Brief（quiet 不发 panel 事件——chip 流程内调用，不开面板）
[[method]]
name = "session_brief"
handler = "coding.session_brief"
direct = true
quiet = true

# 多工位(R4):打开 coding:studio module 面板(插件页子入口 open="studio" 直调)
[[method]]
name = "coding.studio"
handler = "coding.studio"
direct = true
panel = "coding:studio"
