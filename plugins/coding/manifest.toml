id = "coding"
name = "编码"
description = "统一 coding 聊天：选项目 + Claude Code，提任务后台流式跑，面板回显 + 文件改动 diff。v1 单 agent、用户显式选、不 auto-routing。"
# llm：HandoffBriefSkill 用 ctx.llm 摘要交接（plugins.py:240 校验）。
# process：声明性，本插件 v1 仍为 in-process SDK；加是为交接链路上对齐 agents。
capabilities = ["db", "llm", "process"]

[code]
entry = "skills"

[[table]]
name = "sessions"
columns = [
  {name = "id", type = "text", pk = true},
  {name = "agent", type = "text", default = "claude-code"},
  {name = "cwd", type = "text"},
  {name = "prompt", type = "text"},
  {name = "status", type = "text", default = "running"},   # running/done/stopped/failed
  {name = "created_at", type = "integer"},
  {name = "finished_at", type = "integer", default = 0},
  {name = "cc_session_id", type = "text", default = ""},   # Claude Code 会话 id（runner.run 返回；后续多轮 resume 用）
  {name = "source", type = "text", default = ""},           # 会话来源：""=用户直起；"codex:<sid>"=交接切过来
  {name = "mode", type = "text", default = "acceptEdits"},  # 权限模式（plan/acceptEdits/…，下一任务接线用）
  {name = "usage_baseline", type = "text", default = ""},   # codex usage 差分基准（JSON 串 {"input_tokens":N,"output_tokens":N}；多轮 resume 跨轮持久，内存 entry 流终即丢）
]
indexes = ["status", "created_at"]

[[table]]
name = "messages"
columns = [
  {name = "id", type = "text", pk = true},
  {name = "session_id", type = "text"},
  {name = "role", type = "text"},        # user/assistant/marker
  {name = "text", type = "text"},
  {name = "ts", type = "integer"},
  {name = "seq", type = "integer"},
  {name = "uuid", type = "text", default = ""},   # user 消息的 CC uuid（rewind 回滚锚点）
]
indexes = ["session_id", "seq"]

# R4 多工位(module 面板,新插件运行时):panel/dist 由 scripts/panel-build 构建;
# open 让插件页出现子入口「多工位」,直调 coding.studio 打开
[[panel]]
type = "module"
name = "studio"
label = "多工位"
src = "panel/dist/index.html"
open = "studio"
input = "handoff"
