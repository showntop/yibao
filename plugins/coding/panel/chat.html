        var time = when ? (when.getMonth() + 1) + "/" + when.getDate() + " " + String(when.getHours()).padStart(2, "0") + ":" + String(when.getMinutes()).padStart(2, "0") : "";
        var cwdShort = (row.cwd || "").split("/").filter(Boolean).pop() || row.cwd || "";
        var first = String(row.prompt || "").split("\n")[0].slice(0, 42);
        b.innerHTML = "<span class=\"ht\">" + esc(time) + "</span>" +
          "<span class=\"hc\">" + esc(cwdShort) + "</span>" +
          "<span class=\"hp\">" + esc(first) + "</span>" +
          "<span class=\"hs " + esc(row.status || "") + "\">" + esc(row.status || "") + "</span>";
        b.addEventListener("click", function () { resumeSession(row.id); });
        body.appendChild(b);
      });
    }).catch(function (e) {
      body.innerHTML = "<div class=\"mempty\">加载失败：" + esc(emsg(e)) + "</div>";
    });
  }

  function closeHistory() {
    $("history-overlay").hidden = true;
  }

  function resumeSession(sid) {
    window.yibao.invoke("coding.history", { id: sid }).then(function (r) {
      if (currentSession) discardedSessions[currentSession] = true;
      currentSession = sid;
      delete discardedSessions[sid]; // 恢复的目标会话必须出黑名单——否则它自己的流全被「陈旧会话」过滤器吞掉，面板锁死
      currentBubble = null;
      lastToolCard = null;   // #log 清空后旧卡已 detach，防 tool_result 落进不可见节点（同 newChat）
      fallbackUserBubble = null;  // 同 newChat：清兜底气泡引用，防迟到 user_msg 升级陈旧节点
      hideErrBar();          // 同 newChat：清屏后旧 turn 错误条一并消失
      stopTicker();
      hideRunPill();         // 同 newChat：pill 不残留
      resetUsage();          // C4：恢复历史不补旧账，清零重计（接受降级）
      streaming = false;
      $("log").innerHTML = "";
      (r.messages || []).forEach(function (m) {
        if (m.role === "user") appendUser(m.text, m.uuid || "");
        else { var b = appendAssistantBubble(); appendTextToBubble(b, m.text); finalizeBubble(b); b.classList.add("done"); }
      });
      if ((r.messages || []).length) appendMarker("—— 以上为历史，继续聊 ↓ ——", false);
      if (r.cwd) $("cwd").value = r.cwd;
      $("history-overlay").hidden = true;
      $("new-chat").disabled = false;
      $("send").disabled = false;
      setStatus("已恢复会话 " + sid + "，发消息将在同一上下文继续");
      $("prompt").focus();
    }).catch(function (e) {
      setStatus("恢复失败：" + emsg(e), true);
      $("history-overlay").hidden = true;
    });
  }

  // 📁 文件夹选择器：native:pick_folder 走 WebviewPanel 白名单旁路直调 Tauri（不经 sidecar）。
  // 桥 resolve 的就是结果本体（路径字符串；取消为 null）——回填 cwd 药丸，手输仍可用。
  function pickCwd() {
    if (!hasBridge) { setStatus("未连译宝桥（设计预览模式）", true); return; }
    window.yibao.invoke("native:pick_folder", {}).then(function (r) {
      if (r) { $("cwd").value = r; }
    }).catch(function () {
      setStatus("选择文件夹失败", true);
    });
  }

  $("send").addEventListener("click", send);
  $("stop").addEventListener("click", stop);
  $("rp-stop").addEventListener("click", stop);   // 运行 pill 的红 Stop 复用同一中断逻辑（C3）
  $("new-chat").addEventListener("click", newChat);
  $("handoff").addEventListener("click", handoff);
  $("cwd-pick").addEventListener("click", pickCwd);
  $("history").addEventListener("click", openHistory);
  $("history-close").addEventListener("click", closeHistory);
  // turn 级错误条「详情」：展开/收起错误全文（摘要行常驻单行）
  $("err-toggle").addEventListener("click", function () {
    var d = $("err-detail");
    var willOpen = d.classList.contains("hidden");
    d.classList.toggle("hidden", !willOpen);
    this.textContent = willOpen ? "收起" : "详情";
    layoutRunPill();  // 详情展开会撑高错误条，pill 重新算 bottom（C3）
  });
  // footer 换行/字号变化导致高度变 → pill 重新贴合（C3）
  window.addEventListener("resize", layoutRunPill);
  $("history-overlay").addEventListener("click", function (e) {
    if (e.target === this) closeHistory();  // 点空白处收起（picker 内点击不冒泡到 overlay 的 target 判定）
  });
  // ---- @ 补全：输入 @ 起模糊搜项目文件，↑↓ 选择，Enter 插入，Esc 关闭 ----
  var atState = { open: false, items: [], idx: 0, query: "", start: -1 };
  function closeAt() { atState.open = false; $("at-menu").hidden = true; }
  function openAt() { atState.open = true; $("at-menu").hidden = false; }

  function atQuery() {
    if (!hasBridge) return;
    var cwd = $("cwd").value.trim();
    if (!cwd) return;
    window.yibao.invoke("coding.files", { cwd: cwd, q: atState.query }).then(function (r) {
      atState.items = (r && r.files) || [];
      atState.idx = 0;
      var m = $("at-menu");
      m.innerHTML = "";
      if (!atState.items.length) { m.innerHTML = "<div class=\"at-empty\">无匹配</div>"; openAt(); return; }
      atState.items.slice(0, 12).forEach(function (f, i) {
        var d = document.createElement("div");
        d.className = "at-item" + (i === 0 ? " sel" : "");
        d.textContent = f.rel;
        d.addEventListener("mousedown", function (e) { e.preventDefault(); atInsert(f.rel); });
        m.appendChild(d);
      });
      openAt();
    }).catch(function () { closeAt(); });
  }

  function atInsert(rel) {
    var ta = $("prompt");
    var v = ta.value;
    ta.value = v.slice(0, atState.start) + "@" + rel + " " + v.slice(ta.selectionStart);
    ta.focus();
    closeAt();
  }

  $("prompt").addEventListener("input", function () {
    var ta = this;
    var pos = ta.selectionStart;
    var before = ta.value.slice(0, pos);
    var m = before.match(/@([\w\-./]*)$/);
    if (m) {
      atState.start = pos - m[0].length;
      atState.query = m[1];
      atQuery();
    } else if (atState.open) closeAt();
  });
  // capture 注册在本元素最前：菜单打开时 Enter/↑↓/Esc 在此消费（preventDefault），
  // 下方发送处理器经 e.defaultPrevented 守卫跳过——同元素监听 stopPropagation 挡不住。
  $("prompt").addEventListener("keydown", function (e) {
    if (!atState.open) return;
    if (e.key === "Escape") { closeAt(); e.stopPropagation(); }
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      var items = document.querySelectorAll("#at-menu .at-item");
      if (!items.length) return;
      items[atState.idx].classList.remove("sel");
      atState.idx = (atState.idx + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
      items[atState.idx].classList.add("sel");
    } else if (e.key === "Enter" && atState.items.length) {
      e.preventDefault(); e.stopPropagation();
      atInsert(atState.items[atState.idx].rel);
    }
  }, true);

  // D1 快捷键与提示行一致：↵ 发送 / ⇧↵ 换行（⌘/Ctrl+↵ 保留为发送别名）。
  // IME 组字（中文输入）中的 Enter 只是上屏，绝不触发发送。
  // 注意 WebKit bug 165004：compositionend 先于确认 Enter 的 keydown 派发，该 keydown 的
  // isComposing=false，单靠 e.isComposing 守卫会穿透——补 compositionend 时间戳兜底（50ms 窗口）。
  var lastCompEnd = 0;
  $("prompt").addEventListener("compositionend", function () { lastCompEnd = Date.now(); });
  $("prompt").addEventListener("keydown", function (e) {
    if (e.defaultPrevented) return;  // @ 补全菜单已消费本次 Enter（注册在前的 capture 处理器）
    if (e.key !== "Enter" || e.shiftKey || e.isComposing || Date.now() - lastCompEnd < 50) return;
    e.preventDefault();
    send();
  });
  // esc 停止：运行/提交中且有活动会话时 = 点 Stop（复用同一中断逻辑）。
  // @ 菜单打开时 prompt 的 capture 处理器已 stopPropagation，这里不会误触发。
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && currentSession && (streaming || sending)) stop();
  });

  // ============================================================
  //   初次进入：预填 cwd（从最近一次会话取，没填过就留空）
  // ============================================================
  function prefillCwd() {
    if (!hasBridge) return;
    window.yibao.invoke("coding.list", {}).then(function (r) {
      var rows = (r && r.sessions) || [];
      if (rows.length && rows[0].cwd && !$("cwd").value) {
        $("cwd").value = rows[0].cwd;
      }
    }).catch(function () { /* 静默：首次使用无会话 */ });
  }

  // ============================================================
  //   注册 onInit（每条 panel_data 触发一次）
  // ============================================================
  if (hasBridge) {
    window.yibao.onInit(handleInitData);
    prefillCwd();
  }

  // ============================================================
  //   设计预览：无桥时塞一段示例对话，便于看样式
  // ============================================================
  function renderPreviewSample() {
    // 延迟到 DOM 就绪（本脚本在 body 末尾，已就绪，但桥缺失分支更安全）
    try {
      appendUser("帮我看一下 src/main.rs 的入口在哪");
      var b = appendAssistantBubble();
      appendTextToBubble(b, "我打开项目看一下 main.rs 的结构…");
      appendFileEdit({ tool: "Read", path: "src/main.rs" });
      appendToolUse({ tool: "Bash", input: { command: "wc -l src/main.rs", description: "统计行数" } });
      appendToolResult({ text: "152 src/main.rs" });
      var b2 = appendAssistantBubble();
      appendTextToBubble(b2, "入口在 src/main.rs:12 的 fn main()。需要我加点日志吗？");
      b2.classList.add("done");
    } catch (e) { /* 预览失败无所谓 */ }
  }

  // 设计预览入口：必须在 IIFE 末尾调用——顶部桥检测时 $/raf 等 var 尚未赋值，
  // 提前调用会 TypeError 并被 renderPreviewSample 的 try/catch 静默吞掉（HEAD 版即此 bug）
  if (!hasBridge) renderPreviewSample();
})();
</script>
