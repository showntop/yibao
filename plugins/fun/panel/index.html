<!DOCTYPE html>
<!-- 娱乐面板（module 面板，R4 插件运行时）：视频热榜 / 音乐直达 / 每日一言。
     由 yibao-plugin://fun/ 协议按需服务，桥 SDK（window.yibao）由协议层注入。
     内嵌播放：B站官方嵌入播放器（player.bilibili.com）+ 网易云外链播放器（music.163.com/outchain），
     免登录免下载，版权正路；CSP 仅对 fun 放行这两域 + 媒体流 + 封面图（见 plugin_proto.rs csp_meta）。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>娱乐</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="seg">
  <button id="tab-videos" class="on">视频</button>
  <button id="tab-music">音乐</button>
  <button id="tab-quote">段子</button>
</div>

<!-- 视频热榜 -->
<div id="page-videos">
  <div id="vid-main">
    <div class="toolbar" style="margin-bottom:6px;">
      <input type="text" id="vid-kw" placeholder="搜视频 / UP主，如：牛来 电影解说" spellcheck="false" />
      <button class="act" id="vid-search">搜索</button>
    </div>
    <div class="toolbar">
      <label class="opt">分区
        <select id="vid-tid"></select>
      </label>
      <button class="act ghost" id="vid-refresh">换一批</button>
      <span class="spacer"></span>
      <span class="hint">点卡片面板内看</span>
    </div>
    <div class="banner err hidden" id="vid-err"></div>
    <div class="card" style="flex:1; display:flex; flex-direction:column; min-height:0;">
      <div class="list" id="vid-list"></div>
    </div>
  </div>
  <div id="player-view" class="hidden">
    <div class="toolbar">
      <button class="act ghost" id="player-back">‹ 返回列表</button>
      <span class="ptitle" id="player-title"></span>
      <span class="spacer"></span>
      <button class="act ghost" id="player-open">浏览器打开</button>
    </div>
    <div class="player-wrap">
      <!-- allow-same-origin:嵌套在宿主 sandbox(allow-scripts) 里会继承为 opaque origin,
           B站播放器访问 localStorage/cookie 即抛错初始化失败黑屏;子 iframe 显式补上此 flag
           让播放器以自身 https 真实 origin 运行(只影响自己,不跨域)。
           注意:不要加 allow-presentation——WKWebView 不认该 sandbox flag,sandbox 属性整体解析
           失败会导致 allow-same-origin 也失效(又变回 opaque,getCookie SecurityError 黑屏)。
           全屏由独立的 allowfullscreen + allow="fullscreen" 提供。 -->
      <iframe id="player-frame" class="player-frame"
        sandbox="allow-scripts allow-same-origin"
        allowfullscreen allow="autoplay; fullscreen"></iframe>
    </div>
  </div>
  <!-- 站内搜索视图：内嵌 B站官方搜索页（无 X-Frame-Options 可嵌），点结果即在站内视频页播放 -->
  <div id="search-view" class="hidden">
    <div class="toolbar">
      <button class="act ghost" id="search-back">‹ 返回列表</button>
      <span class="ptitle" id="search-title"></span>
      <span class="spacer"></span>
      <button class="act ghost" id="search-open">浏览器打开</button>
    </div>
    <div class="player-wrap">
      <iframe id="search-frame" class="player-frame"
        sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
  </div>
</div>

<!-- 音乐直达 -->
<div id="page-music" class="hidden">
  <div class="card">
    <div class="card-head">搜歌 <span class="muted">歌名 / 歌手 / 风格</span></div>
    <div class="toolbar" style="margin:8px 12px 2px;">
      <input type="text" id="mu-kw" placeholder="想听什么？如：周杰伦 / 白噪音" spellcheck="false" />
      <button class="act" id="mu-search">搜索</button>
    </div>
    <div class="chips" id="mu-hot"></div>
  </div>
  <div class="card hidden" id="mu-result-card">
    <div class="card-head">「<span id="mu-result-kw"></span>」点歌直接听 <span class="muted">网易云官方播放器</span>
      <span class="spacer"></span>
      <button class="chip" id="mu-qq-link" title="版权在 QQ 音乐的艺人（如周杰伦）原版在 QQ 音乐">QQ 原版 ›</button>
    </div>
    <div class="list" id="mu-result"></div>
  </div>
  <!-- 播放器嵌条：搜索/热歌榜点歌都内嵌到这里（官方 outchain 播放器，auto=1 点开即播） -->
  <div class="song-embed hidden" id="song-embed">
    <iframe id="song-frame" sandbox="allow-scripts allow-same-origin" allow="autoplay"
      style="width:100%;height:66px;border:none;"></iframe>
  </div>
  <!-- QQ 音乐搜索视图：版权在 QQ 的艺人原版（内嵌 QQ 搜索页，点第一个即播） -->
  <div id="qq-search-view" class="hidden">
    <div class="toolbar">
      <button class="act ghost" id="qq-back">‹ 返回</button>
      <span class="ptitle" id="qq-title"></span>
      <span class="spacer"></span>
      <button class="act ghost" id="qq-open">浏览器打开</button>
    </div>
    <div class="player-wrap">
      <iframe id="qq-frame" class="player-frame"
        sandbox="allow-scripts allow-same-origin" allow="autoplay"></iframe>
    </div>
  </div>
  <div class="card">
    <div class="card-head">热歌榜 <span class="muted">网易云云音乐 · 点歌即播</span></div>
    <div class="list" id="mu-chart"></div>
  </div>
  <div class="card">
    <div class="card-head">直接逛逛 <span class="muted">打开平台首页</span></div>
    <div class="list" id="mu-platforms"></div>
  </div>
</div>

<!-- 每日一言 -->
<div id="page-quote" class="hidden">
  <div class="card quote-card">
    <div class="quote-text" id="qt-text"></div>
    <div class="quote-from" id="qt-from"></div>
  </div>
  <div class="toolbar">
    <label class="opt">分类
      <select id="qt-cat"></select>
    </label>
    <button class="act" id="qt-next">换一句</button>
    <button class="act ghost" id="qt-joke">AI 讲一个</button>
    <span class="spacer"></span>
    <span class="hint">hitokoto · AI 段子</span>
  </div>
  <div class="banner err hidden" id="qt-err"></div>
</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
