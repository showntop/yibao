# 闪念盘（全声明式插件，v2 方案 §3.4 第一档）
id = "notes"
name = "闪念盘"
description = "闪念笔记：随手记一句话灵感/备忘（收藏链接、文章等写作素材请用 zimeiti 素材库，不要用本插件）"
capabilities = ["db"]

[[table]]
name = "notes"
columns = [
  {name = "id", type = "text", pk = true},
  {name = "text", type = "text"},
  {name = "tags", type = "text", default = "[]"},
  {name = "created_at", type = "integer"},
]
indexes = ["created_at"]

[[tool]]
id = "keep"
type = "db"
description = "记录用户明确要求保存的想法/灵感/备忘（一句话）。仅当用户主动要「记一下/记条闪念」时调用；用户随口说的偏好/习惯会自动进入长期记忆，不要用此工具记录偏好"
risk = "L1"
panel = "notes:list"
presentation = "inline"
refresh = "list"   # 写入后面板拿刷新列表，而非回执 {"id":…}
required = ["text"]
[tool.params]
text = {type = "string", description = "要记的想法/灵感/备忘（一句话）"}
[tool.db]
op = "insert"
table = "notes"
auto = {created_at = "unixts"}   # created_at 由系统生成（unix 秒）

[[tool]]
id = "list"
type = "db"
description = "列出闪念（按时间倒序，最多 50 条）"
risk = "L0"
panel = "notes:list"
[tool.db]
op = "query"
table = "notes"
order = "created_at DESC"
limit = 50

[[tool]]
id = "delete"
type = "db"
description = "删除一条闪念"
risk = "L2"
panel = "notes:list"
refresh = "list"
required = ["id"]
[tool.params]
id = {type = "string", description = "闪念 id"}
[tool.db]
op = "delete"
table = "notes"

[[panel]]
type = "schema"
name = "list"
label = "闪念列表"
src = "panel/list.schema.json"

# 主屏 widget（OS 感 §4.2）：最近闪念一瞥卡；method 供数据（L0），open 点击跳全面板
[[panel]]
type = "widget"
name = "widget"
label = "最近闪念"
src = "panel/widget.schema.json"
method = "list"
open = "list"
